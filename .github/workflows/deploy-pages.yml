name: Deploy Mohafzaty Pro to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Prepare approved wallet icon
        run: |
          cat .github/assets/icon-parts/icon-*.b64 | tr -d '\r\n' | base64 --decode > site/app/icon-transparent-192.png
          python - <<'PY'
          import struct
          path = 'site/app/icon-transparent-192.png'
          data = open(path, 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Invalid PNG signature'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (192, 192), f'Unexpected icon dimensions: {width}x{height}'
          print(f'Validated transparent app icon: {width}x{height}, {len(data)} bytes')
          PY

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy site --project-name=mohafzaty-pro --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
