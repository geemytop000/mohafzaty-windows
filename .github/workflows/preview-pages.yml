name: Preview Mohafzaty Pro on Cloudflare Pages

on:
  push:
    branches:
      - wallet-guides-and-article-cta
    paths:
      - 'site/**'
      - '.github/workflows/preview-pages.yml'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Get preview branch files
        uses: actions/checkout@v4
        with:
          ref: wallet-guides-and-article-cta

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler@latest pages deploy site --project-name=mohafzaty-pro --branch=wallet-guides-and-article-cta
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
