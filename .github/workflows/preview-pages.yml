name: Preview Mohafzaty Pro on Cloudflare Pages

on:
  push:
    branches:
      - codex/mobile-loading-priority
      - codex/mobile-performance
      - codex/independent-content
      - wallet-guides-and-article-cta
      - add-ga4-website-analytics
      - track-registration-downloads-clicks
      - codex/web-growth-improvements
      - codex/transfer-notification-review
      - codex/wallet-number-provider-guardrails
    paths:
      - 'site/**'
      - '.github/workflows/preview-pages.yml'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Get preview branch files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Render matching preview icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width=192 --height=192 --format=png site/app/favicon.svg > site/app/icon-192.png
          rsvg-convert --width=512 --height=512 --format=png site/app/favicon.svg > site/app/icon-512.png
          rsvg-convert --width=512 --height=512 --format=png site/app/favicon.svg > site/app/icon-maskable-512.png
          cp site/app/icon-192.png site/app/icon-transparent-192.png
          base64 --decode .github/assets/root-favicon.ico.b64 > site/favicon.ico
          test -s site/favicon.ico

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler@latest pages deploy site --project-name=mohafzaty-pro --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
