name: Deploy Mohafzaty Pro to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Render all site icons from shared oval artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width=192 --height=192 --format=png site/app/favicon.svg > site/app/icon-192.png
          rsvg-convert --width=512 --height=512 --format=png site/app/favicon.svg > site/app/icon-512.png
          rsvg-convert --width=512 --height=512 --format=png site/app/favicon.svg > site/app/icon-maskable-512.png
          cp site/app/icon-192.png site/app/icon-transparent-192.png
          python - <<'PY'
          import struct
          from pathlib import Path
          for path, expected in [('site/app/icon-192.png', 192), ('site/app/icon-512.png', 512), ('site/app/icon-maskable-512.png', 512), ('site/app/icon-transparent-192.png', 192)]:
              data = Path(path).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'Invalid PNG: {path}'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (expected, expected), f'Unexpected dimensions for {path}: {width}x{height}'
              print(f'Validated {path}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Prepare root favicon for browsers and Google
        run: |
          base64 --decode .github/assets/root-favicon.ico.b64 > site/favicon.ico
          python - <<'PY'
          from pathlib import Path
          data = Path('site/favicon.ico').read_bytes()
          assert data[:4] == bytes([0, 0, 1, 0]), 'Invalid ICO signature'
          assert int.from_bytes(data[4:6], 'little') >= 1, 'ICO contains no images'
          print(f'Validated root favicon: {len(data)} bytes')
          PY

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy site --project-name=mohafzaty-pro --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
