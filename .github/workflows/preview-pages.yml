name: Preview Mohafzaty Pro on Cloudflare Pages

on:
  push:
    branches:
      - codex/independent-content
      - wallet-guides-and-article-cta
      - add-ga4-website-analytics
      - track-registration-downloads-clicks
      - codex/web-growth-improvements
      - codex/transfer-notification-review
      - codex/wallet-number-provider-guardrails
    paths:
      - 'site/**'
      - '.github/workflows/preview-pages.yml'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Get preview branch files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Prepare approved app icon for preview
        run: cat .github/assets/icon-parts/icon-*.b64 | tr -d '\\r\\n' | base64 --decode > site/app/icon-transparent-192.png

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler@latest pages deploy site --project-name=mohafzaty-pro --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
