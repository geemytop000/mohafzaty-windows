  syncBtn.textContent = '🔄';
  syncBtn.className = 'fab noprint'; syncBtn.style.bottom = '64px';
  syncBtn.onclick = function () { accountDialog(); };
  document.body.appendChild(syncBtn); setSyncBtn();

function normBotText(str) {
  return String(str || '').toLowerCase()
    .replace(/[أإآ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/[^\w\s\u0600-\u06FF]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function botHasAny(n, words) {
  return words.some(w => n.includes(normBotText(w)));
}
function botHasAll(n, groups) {
  return groups.every(g => botHasAny(n, g));
}

function processBotQuery(rawQuery) {
  const q = String(rawQuery || '').trim();
  if (!q) return 'من فضلك اكتب سؤالك أو اختر أحد الأسئلة السريعة بالأعلى 🤖';
  const n = normBotText(q);

  // الاشتراكات غير متاحة حاليًا
  if (botHasAny(n, ['اشترك', 'اشتراك', 'باق', 'عروض', 'اسعار', 'سعر', 'كام الاشتراك', 'رقم التواصل', 'ارقام التواصل', 'واتساب المبيعات', 'ازاي اجدد', 'طريقه الاشتراك', 'عايز اشترك'])) {
    return 'محفظتي برو مجاني للتسجيل والاستخدام، ويمكنك استخدام الوظائف المتاحة دون اشتراك أو رسوم. سجّل الدخول لإعداد المزامنة بين أجهزتك.';
  }

  // 1. تحية واستفسار عن هوية البوت
  if (botHasAny(n, ['سلام', 'مرحبا', 'ازيك', 'صباح الخير', 'مساء الخير', 'اهلا', 'مين انت', 'انت مين', 'بتعمل ايه', 'تعمل ايه', 'عرفني بيك', 'مين حضرتك', 'وظيفتك', 'امكانياتك', 'بتعرف تعمل'])) {
    return 'أهلاً وسهلاً بك! 👋 أنا **مساعد الدفتر الذكي في برنامج محفظتي برو (mohafzaty-pro) 🤖**.\n\n' +
      'أنا متصل مباشرة وبشكل لحظي بكل حسابات وأرصدة الدفتر الخاص بك. يمكنك سؤالي باللغة العامية أو الفصحى عن:\n' +
      '• 💵 **موقف الكاش والدرج والخزينة**\n' +
      '• 🏦 **إجمالي رأس المال وأصول المحل**\n' +
      '• 📱 **أرصدة خطوط ومحافظ المحمول والحدود المتبقية**\n' +
      '• 📊 **ملخص عمليات اليوم وجرد الوردية**\n' +
      '• 💰 **العمولات والأرباح المحققة**\n' +
      '• 👥 **ديون العملاء (دائن ومدين)** أو حساب عميل معين\n' +
      '• ❓ **طريقة استخدام أي ميزة في البرنامج** (تحويلات، إيصالات، أمان...)\n\n' +
      'جرّب أن تضغط على أحد الأزرار السريعة بالأعلى أو اكتب سؤالك مباشرة!';
  }

  // 2. إرشادات وشروحات استخدام البرنامج (How-To Knowledge Base)
  // إضافة أو تعديل خط
  if (botHasAll(n, [['اضيف', 'اضافه', 'تعديل', 'حذف', 'جديد'], ['خط', 'محفظ']])) {
    return '📱 **طريقة إضافة أو تعديل خط محفظة جديد:**\n' +
      '1. اضغط على تبويب **إدارة الخطوط** في الشريط العلوي.\n' +
      '2. اضغط على زر **➕ إضافة رقم محفظة**.\n' +
      '3. اكتب رقم الموبايل (مثال: 01012345678)، واسم المحفظة، والرصيد الافتتاحي، والحد اليومي والشهري.\n' +
      '4. اضغط **إضافة** وسيعرض البرنامج الاستخدام المسجل والمتبقي، وينبهك عند الاقتراب من الحدود التي أدخلتها، وقد يمنع حفظ قيد يتجاوزها. هذا لا ينفذ معاملة لدى مقدم الخدمة ولا يقرأ عداده أو يغير حدوده.\n' +
      '*(ملاحظة: إذا كان المستخدم كاشيراً، يطلب النظام كلمة سر المدير أو الخطوط لحماية الأرقام)*.';
  }

  // التحويل بين الخطوط أو الخزينة
  if (botHasAny(n, ['تحويل', 'احول', 'تغذيه']) && botHasAny(n, ['درج', 'خط', 'بين الخط', 'محفظ', 'قسم'])) {
    return '🔁 **طريقة التحويل بين الخزينة والخطوط:**\n' +
      '1. في الصفحة الرئيسية، اضغط على زر **🔁 تحويل بين الأقسام**.\n' +
      '2. في خانة **(من)**: اختر الجهة التي سيخرج منها المبلغ (مثلاً: الدرج، أو خط فودافون، أو خط أورنج).\n' +
      '3. في خانة **(إلى)**: اختر الجهة المستلمة.\n' +
      '4. اكتب المبلغ والملاحظات واضغط **تنفيذ التحويل**.\n' +
      '✅ يتم خصم المبلغ من المصدر وإضافته للمستلم فورياً دون التأثير على رأس المال الكلي للمحل.';
  }

  // تسجيل العمليات
  if (!botHasAny(n, ['الغ', 'عكس', 'تصحيح', 'حذف', 'نهارد', 'يوم', 'ملخص', 'كام']) && (botHasAny(n, ['ازاي اسحب', 'ازاي اودع', 'طريقه السحب', 'طريقه الايداع', 'ازاي اسجل', 'تسجيل عمليه']) || (botHasAny(n, ['ازاي', 'طريق', 'كيف']) && botHasAny(n, ['سحب', 'ايداع'])))) {
    return '💼 **طريقة تسجيل عمليات السحب والإيداع:**\n' +
      '• **السحب (كاش يخرج من الدرج ورصيد يدخل المحفظة):** اضغط `+ عملية إيداع / سحب` -> اختر النوع `سحب` -> اكتب المبلغ والخط المستخدم واضغط `حفظ العملية`.\n' +
      '• **الإيداع (كاش يدخل الدرج ورصيد يخرج من المحفظة):** اختر `إيداع (تحويل)` وسيتكفل البرنامج بحساب العمولة التلقائية وضبط الأرصدة فوراً.';
  }

  // طباعة الإيصالات والواتساب
  if (botHasAny(n, ['ايصال', 'طباع', 'فاتوره', 'حراري', 'طابعه', 'اطبع ريسيت'])) {
    return '🖨️ **طريقة طباعة إيصال حراري أو إرساله بالواتساب:**\n' +
      '1. اضغط على أي عملية مسجلة في جدول العمليات لفتح نافذة التفاصيل.\n' +
      '2. ستجد زر **🖨️ طباعة إيصال حراري** متوافق مع طابعات البلوتوث والـ USB (مقاس 80 مم و 58 مم) ومزود برمز QR للتحقق.\n' +
      '3. أو اضغط **📲 إرسال واتساب** لمشاركة الفاتورة بنقرة واحدة إلى رقم هاتف العميل مباشرة برابط فوري.';
  }

  // كلمات المرور والصلاحيات
  if (botHasAny(n, ['كلمه سر', 'كلمات سر', 'باسورد', 'تغيير السر', 'صلاحيات', 'كاشير ومدير'])) {
    return '🔒 **نظام كلمات المرور وصلاحيات الكاشير:**\n' +
      '• يمكنك تعيين كلمة سر موحدة لكل شيء، أو تفعيل **🛡️ كلمات سر مختلفة لكل حاجة** من شاشة الإعدادات.\n' +
      '• الأقسام المحمية: حساب المدير، شاشة الإعدادات، إدارة الخطوط والحدود، والإلغاء وتعديل الأرصدة.\n' +
      '• عند التبديل لحساب الكاشير، تُقفل شاشة الإعدادات تلقائياً، مع إمكانية إظهار أو إخفاء رأس المال في الرئيسية بضغطة زر.';
  }

  // النسخ الاحتياطي
  if (botHasAny(n, ['نسخه احتياطي', 'باك اب', 'استرجاع', 'احفظ البيانات', 'حفظ تلقائي'])) {
    return '💾 **النسخ الاحتياطي والأمان:**\n' +
      '• **يدوياً:** من شاشة الإعدادات اضغط **⬇️ نسخة احتياطية (JSON)** لتحميل ملف يحتوي على كل عملياتك وحساباتك.\n' +
      '• **تلقائياً:** اضغط **اختيار مجلد** على متصفح Chrome/Edge واختر مجلداً على جهازك أو Google Drive ليتم حفظ ملفات الشهور ونسخة احتياطية محدثة بعد كل عملية تلقائياً.';
  }

  // الاشتراكات متوقفة حاليًا
  if (botHasAny(n, ['اشتراك', 'تفعيل', 'ترخيص', 'تجديد', 'كود الجهاز', 'رخصه'])) {
    return 'محفظتي برو مجاني للتسجيل والاستخدام، ويمكنك استخدام الوظائف المتاحة دون اشتراك أو رسوم. سجّل الدخول لفتح البرنامج وإعداد المزامنة.';
  }

  // الإلغاء والقيد العكسي
  if (botHasAny(n, ['الغاء', 'الغي', 'قيد عكسي', 'تصحيح', 'مسح عمليه', 'احذف عمليه', 'ازاي الغي'])) {
    return '🚫 **إلغاء العمليات والقيد العكسي:**\n' +
      '• النظام يتبع المعايير المحاسبية الدقيقة: **لا يتم مسح العمليات نهائياً لمنع التلاعب**.\n' +
      '• لإلغاء أي عملية: افتح تفاصيلها واضغط **🚫 إلغاء العملية بقيد عكسي**، واكتب سبب الإلغاء.\n' +
      '• سيُسجل قيد تصحيح يعكس تأثير العملية على الخزينة والخطوط وتظل العملية الأصلية ظاهرة في السجل بعلامة خط شطب لحفظ حقوقك.';
  }

  // 3. استعلامات البيانات الحسابية المباشرة (Live Financial Data)
  // كاش الدرج والخزينة
  if (botHasAny(n, ['درج', 'خزن', 'كاش متاح', 'كاش العمليات', 'فلوس الدرج', 'الكاش كام', 'معايا كاش', 'الكاش اللي معايا', 'الدرج فيه كام'])) {
    const T = totals();
    const totalCash = round2(T.drawerBalance + T.commissionAccumulated);
    const lowWarning = S().lowCash > 0 && totalCash < S().lowCash 
      ? '\n⚠️ **تنبيه:** الكاش الحالي أقل من حد التنبيه المحدد في الإعدادات (' + fmt(S().lowCash) + ' ' + CUR + ').'
      : '';

    return '💵 **موقف النقدية والكاش المتاح الآن:**\n' +
      '• **كاش الدرج الرئيسي:** ' + fmt(T.drawerBalance) + ' ' + CUR + '\n' +
      '• **رصيد خانة العمولة:** ' + fmt(T.commissionAccumulated) + ' ' + CUR + '\n' +
      '• **إجمالي النقدية المتاحة للصرف:** **' + fmt(totalCash) + ' ' + CUR + '**' +
      lowWarning;
  }

  // رأس المال الإجمالي
  if (botHasAny(n, ['راس المال', 'راس مال', 'راس مالي', 'كل الفلوس', 'اصول المحل', 'اجمالي المال', 'فلوس المحل كلها'])) {
    if (!canViewCapital()) {
      return '🔒 **حساب رأس المال الإجمالي:**\nعفواً، تم إخفاء إجمالي رأس المال عن حساب الكاشير من شاشة الإعدادات بواسطة المدير.';
    }
    const T = totals();
    const totalCash = round2(T.drawerBalance + T.commissionAccumulated);
    let secStr = '';
    if (S().sections && S().sections.length) {
      secStr = S().sections.map(s => '  - ' + s.name + ': ' + fmt(T.acctB[s.id] || 0) + ' ' + CUR).join('\n');
      if (secStr) secStr = '\n• **الأقسام الإضافية:**\n' + secStr;
    }
    return '🏦 **إجمالي رأس المال وأصول المحل:**\n' +
      '💰 **المبلغ الكلي:** **' + fmt(T.totalCapital) + ' ' + CUR + '**\n\n' +
      '📊 **تفصيل الأصول:**\n' +
      '• **إجمالي الكاش (الدرج + العمولة):** ' + fmt(totalCash) + ' ' + CUR + '\n' +
      '• **أرصدة خطوط ومحافظ المحمول:** ' + fmt(T.phoneBalance) + ' ' + CUR + '\n' +
      (T.fawryBalance ? '• **رصيد مكنة فوري:** ' + fmt(T.fawryBalance) + ' ' + CUR + '\n' : '') +
      secStr;
  }

  // ملخص اليوم والوردية
  if ((botHasAny(n, ['عملي', 'حرك', 'شغل', 'ملخص', 'تقرير', 'جرد']) && botHasAny(n, ['نهارد', 'يوم', 'ورد'])) || botHasAny(n, ['ملخص اليوم', 'جرد الورديه'])) {
    const today = todayStr();
    const list = active();
    const tdMain = list.filter(t => t.date === today && (t.type === 'سحب' || t.type === 'ايداع'));
    const wList = list.filter(t => t.date === today && t.type === 'سحب');
    const dList = list.filter(t => t.date === today && t.type === 'ايداع');
    const tdCom = list.filter(t => t.date === today && t.type === 'عمولة').reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const wSum = wList.reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const dSum = dList.reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const T = totals();

    return '📊 **ملخص عمليات ووردية اليوم (' + fmtDate(today) + '):**\n' +
      '• **عدد العمليات الكلي:** ' + tdMain.length + ' عملية\n' +
      '• **عمليات السحب:** ' + wList.length + ' عملية بمبلغ **' + fmt(wSum) + ' ' + CUR + '**\n' +
      '• **عمليات الإيداع:** ' + dList.length + ' عملية بمبلغ **' + fmt(dSum) + ' ' + CUR + '**\n' +
      '• **إجمالي حجم التعامل:** ' + fmt(wSum + dSum) + ' ' + CUR + '\n' +
      '• **عمولة اليوم المحققة:** **' + fmt(tdCom) + ' ' + CUR + '**\n\n' +
      '💵 **الكاش الحالي في الخزينة:** ' + fmt(T.drawerBalance + T.commissionAccumulated) + ' ' + CUR;
  }

  // العمولة والأرباح
  if (botHasAny(n, ['عمول', 'ارباح', 'مكسب', 'كسبنا كام', 'عموله النهارد', 'عموله الشهر'])) {
    const today = todayStr();
    const curMonth = currentMonthKey();
    const list = active();
    const tdCom = list.filter(t => t.date === today && t.type === 'عمولة').reduce((s, t) => s + (Number(t.amount) || 0), 0);
    const T = totals();

    return '🏷️ **تقرير العمولات والأرباح:**\n' +
      '• **عمولة اليوم (' + fmtDate(today) + '):** **' + fmt(tdCom) + ' ' + CUR + '**\n' +
      '• **عمولة الشهر الحالي (' + monthLabel(curMonth) + '):** **' + fmt(T.commissionMonth) + ' ' + CUR + '**\n' +
      '• **إجمالي العمولة التراكمية في الدفتر:** **' + fmt(T.commissionAccumulated) + ' ' + CUR + '**\n\n' +
      '💡 *ملاحظة:* خانة العمولة مستقلة ومحفوظة عن رصيد الدرج الرئيسي لمنع تداخل أرباح المحل مع كاش التداول.';
  }

  // الديون وحسابات العملاء (البحث عن عميل محدد أو كشف عام)
  const custs = (typeof customers === 'function') ? customers() : [];
  const matchedCust = custs.find(c => n.includes(normBotText(c.name)));
  if (matchedCust) {
    const isLent = matchedCust.lent > 0.004;
    return '👤 **حساب العميل (' + esc(matchedCust.name) + '):**\n' +
      (isLent ? '• **المبلغ المطلوب منه (دائن):** **' + fmt(matchedCust.lent) + ' ' + CUR + '** (لك عنده)\n' : '') +
      (matchedCust.borrowed > 0.004 ? '• **المبلغ المستحق له (مدين):** **' + fmt(matchedCust.borrowed) + ' ' + CUR + '** (عليك له)\n' : '') +
      (matchedCust.phone ? '• **رقم الهاتف:** ' + esc(matchedCust.phone) + '\n' : '') +
      '• **تاريخ آخر معاملة:** ' + fmtDate(matchedCust.last) + '\n\n' +
      '📲 *يمكنك إرسال تذكير بالواتساب بنقرة واحدة من تبويب "العملاء".*';
  }

  if (botHasAny(n, ['ديون', 'عملا', 'دائن', 'مدين', 'ليا كام', 'عليا كام', 'فلوسنا عند مين', 'مين عليه', 'مين ليه'])) {
    if (!custs.length) {
      return '✅ **حسابات الديون والعملاء:**\nممتاز! لا توجد أي ديون مفتوحة حالياً، جميع القيود مسواة بالكامل.';
    }
    const owedToMe = custs.reduce((s, c) => s + c.lent, 0);
    const iOwe = custs.reduce((s, c) => s + c.borrowed, 0);

    let msg = '👥 **موقف الديون والعملاء الحالي:**\n' +
      '• **إجمالي ليك عند الناس (دائن):** **' + fmt(owedToMe) + ' ' + CUR + '**\n' +
      '• **إجمالي عليك للناس (مدين):** **' + fmt(iOwe) + ' ' + CUR + '**\n\n' +
      '📋 **أبرز الحسابات المفتوحة:**\n';

    custs.slice(0, 5).forEach((c, i) => {
      if (c.lent > 0.004) {
        msg += (i + 1) + '. **' + esc(c.name) + '**: مطلوب منه ' + fmt(c.lent) + ' ' + CUR + '\n';
      } else if (c.borrowed > 0.004) {
        msg += (i + 1) + '. **' + esc(c.name) + '**: مستحق له ' + fmt(c.borrowed) + ' ' + CUR + '\n';
      }
    });

    if (custs.length > 5) {
      msg += '\n*(يوجد ' + (custs.length - 5) + ' عملاء آخرين، يمكنك مراجعتهم بالكامل من تبويب "العملاء")*';
    }
    return msg;
  }

  // خطوط ومحافظ المحمول (خط محدد أو كل الخطوط)
  const ws = (typeof getWallets === 'function') ? getWallets() : [];
  const matchedWallet = ws.find(w => n.includes(normBotText(w.label)) || n.includes(normBotText(w.phone)));
  if (matchedWallet) {
    const st = getWalletStats(matchedWallet.id);
    return '📱 **بيانات محفظة ' + esc(matchedWallet.label || matchedWallet.phone) + ' (' + esc(matchedWallet.phone) + '):**\n' +
      '• **الرصيد الفعلي الحالي:** **' + fmt(st.balance) + ' ' + CUR + '**\n' +
      '• **حركة سحب اليوم:** ' + fmt(st.withdrawnToday) + ' ' + CUR + ' (' + st.withdrawCount + ' عملية)\n' +
      '• **حركة إيداع اليوم:** ' + fmt(st.depositedToday) + ' ' + CUR + ' (' + st.depositCount + ' عملية)\n' +
      (matchedWallet.dailyLimit > 0 ? '• **الحد اليومي:** ' + fmt(matchedWallet.dailyLimit) + ' ' + CUR + ' (المستهلك: ' + st.pctDaily + '% · باقي اليوم: **' + fmt(st.remDaily) + ' ' + CUR + '**)\n' : '• **الحد اليومي:** غير مقيد\n') +
      (matchedWallet.monthlyLimit > 0 ? '• **الحد الشهري:** ' + fmt(matchedWallet.monthlyLimit) + ' ' + CUR + ' (المستهلك: ' + st.pctMonthly + '% · باقي الشهر: **' + fmt(st.remMonthly) + ' ' + CUR + '**)' : '• **الحد الشهري:** غير مقيد');
  }

  if (botHasAny(n, ['خطوط', 'محافظ', 'محفظه', 'ارصده الخطوط', 'رصيد التلفون', 'فودافون', 'اورنج', 'اتصالات', 'اي اند', 'وي', 'انستاباي', 'حدود', 'حد يومي', 'حد شهري', 'استهلاك', 'المستهلك', 'الحد اليومي', 'الحد الشهري'])) {
    let msg = '📱 **أرصدة خطوط ومحافظ المحمول المسجلة:**\n' +
      '• **إجمالي رصيد الخطوط:** **' + fmt(totals().phoneBalance) + ' ' + CUR + '**\n\n';

    ws.forEach((w, idx) => {
      const st = getWalletStats(w.id);
      const isWarn = st.pctDaily >= 85 || st.pctMonthly >= 85;
      msg += (idx + 1) + '. **' + esc(w.label || w.phone) + '** (' + esc(w.phone) + '):\n' +
        '   - الرصيد: **' + fmt(st.balance) + ' ' + CUR + '**\n' +
        (w.dailyLimit > 0 ? '   - الحد اليومي: ' + fmt(w.dailyLimit) + ' ' + CUR + ' (باقي اليوم: ' + fmt(st.remDaily) + ' ' + CUR + ' · ' + st.pctDaily + '% مستهلك)' : '   - حد يومي: غير مقيد') + '\n' +
        (isWarn ? '   - ⚠️ *تنبيه: قارب على بلوغ الحد الأقصى!*\n' : '');
    });
    return msg;
  }

  // الرد البديل مع التوجيه
  return 'عفواً، لم أستطع فهم سؤالك بدقة 🤖.\nيمكنك سؤالي عن أي من هذه الموضوعات:\n' +
    '• 💵 **الكاش المتاح في الدرج**\n' +
    '• 🏦 **إجمالي رأس المال**\n' +
    '• 📱 **أرصدة خطوط المحافظ واسترداد الحدود**\n' +
    '• 📊 **ملخص اليوم وحركة الوردية**\n' +
    '• 💰 **أرباح وعمولة الشهر**\n' +
    '• 👥 **ديون العملاء (دائن ومدين)**\n' +
    '• ❓ **طريقة استخدام أي ميزة في البرنامج**\n\n' +
    'أو اختر سؤالاً جاهزاً من الأزرار السريعة بالأعلى!';
}

let botHistory = [
  {
    role: 'bot',
    text: 'أهلاً بك! أنا **مساعد الدفتر الذكي في برنامج محفظتي برو (mohafzaty-pro) 🤖**.\nاسألني عن أي حاجة في حساباتك أو طريقة استخدام البرنامج وسأجيبك فوراً بالأرقام الحية.'
  }
];

function formatBotText(txt) {
  let s = esc(txt);
  // تحويل markdown bold **text** إلى <b>text</b>
  s = s.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  // تحويل markdown italic *text* إلى <i>$1</i>
  s = s.replace(/\*(.*?)\*/g, '<i>$1</i>');
  // تحويل السطور
  s = s.replace(/\n/g, '<br>');
  return s;
}

function openBotModal() {
  const existing = document.getElementById('botModalOverlay');
  if (existing) { existing.remove(); return; }

  const ov = document.createElement('div');
  ov.className = 'bot-modal-ov noprint';
  ov.id = 'botModalOverlay';
  
  const chips = [
    '💵 كاش الدرج كام؟',
    '📱 أرصدة الخطوط والحدود',
    '📊 ملخص اليوم والوردية',
    '🏦 إجمالي رأس المال',
    '💰 أرباح وعمولة الشهر',
    '👥 مين عليه ديون؟',
    '🔁 إزاي أحول بين الخطوط؟',
    '🔒 إزاي أغير كلمات السر؟',
    '🖨️ طريقة طباعة إيصال'
  ];

  ov.innerHTML = '<div class="bot-box">' +
    '<div class="bot-head">' +
    '<div class="bot-title"><span class="ico">🤖</span><div><h3>المساعد الذكي</h3><div class="sub">متصل لحظياً بحسابات الدفتر</div></div></div>' +
    '<div class="bot-act">' +
    '<button type="button" class="bot-btn-mini" id="botClearBtn" title="مسح المحادثة">🗑️ مسح</button>' +
    '<button type="button" class="bot-btn-mini" id="botCloseBtn" title="إغلاق">✕</button>' +
    '</div></div>' +
    
    '<div class="bot-chips" id="botChips">' +
    chips.map(c => '<button type="button" class="bot-chip" data-q="' + esc(c) + '">' + esc(c) + '</button>').join('') +
    '</div>' +

    '<div class="bot-msgs" id="botMsgs"></div>' +

    '<div class="bot-input-area">' +
    '<input type="text" class="bot-input" id="botInput" placeholder="اكتب سؤالك هنا... (مثال: كاش الدرج كام؟)" autocomplete="off">' +
    '<button type="button" class="bot-send" id="botSendBtn" title="إرسال">🚀</button>' +
    '</div></div>';

  document.body.appendChild(ov);

  const msgsDiv = ov.querySelector('#botMsgs');
  const inputEl = ov.querySelector('#botInput');
  const sendBtn = ov.querySelector('#botSendBtn');
  const clearBtn = ov.querySelector('#botClearBtn');
  const closeBtn = ov.querySelector('#botCloseBtn');

  function renderMessages() {
    msgsDiv.innerHTML = botHistory.map(m => 
      '<div class="bot-msg ' + m.role + '">' + formatBotText(m.text) + '</div>'
    ).join('');
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  }

  function handleSend(text) {
    const q = text || inputEl.value;
    if (!q || !q.trim()) return;
    botHistory.push({ role: 'user', text: q.trim() });
    inputEl.value = '';
    renderMessages();

    // استجابة فورية ذكية
    setTimeout(() => {
      const ans = processBotQuery(q);
      botHistory.push({ role: 'bot', text: ans });
      renderMessages();
    }, 120);
  }

  renderMessages();
  setTimeout(() => inputEl.focus(), 80);

  sendBtn.onclick = () => handleSend();
  inputEl.onkeydown = e => { if (e.key === 'Enter') handleSend(); };
  
  clearBtn.onclick = () => {
    botHistory = [{
      role: 'bot',
      text: 'تم بدء محادثة جديدة! أنا جاهز للإجابة عن أي سؤال في حساباتك أو البرنامج 🤖.'
    }];
    renderMessages();
  };

  closeBtn.onclick = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });

  ov.querySelectorAll('.bot-chip').forEach(btn => {
    btn.onclick = () => handleSend(btn.dataset.q);
  });
}

function addBotFab() {
  const b = document.createElement('button');
  b.className = 'fab-bot noprint';
  b.id = 'fabBot';
  b.title = 'اسأل مساعد الدفتر الذكي 🤖';
  b.innerHTML = '🤖<span class="bot-badge">AI</span>';
  b.onclick = openBotModal;
  document.body.appendChild(b);
}
addBotFab();

})();
