plugins {
    id "com.android.application"
}

android {
    namespace "com.mohafzatypro.app"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.mohafzatypro.app"
        minSdk 23
        targetSdk 36
        manifestPlaceholders = [webLaunchUrl: "https://mohafzatypro.com/app/"]
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = (System.getenv("ANDROID_VERSION_NAME") ?: "1.0.0")
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".preview"
            manifestPlaceholders = [webLaunchUrl: "https://codex-transfer-notification.mohafzaty-pro.pages.dev/app/"]
            buildConfigField "String", "WEB_BASE_URL", "\"https://codex-transfer-notification.mohafzaty-pro.pages.dev\""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            buildConfigField "String", "WEB_BASE_URL", "\"https://mohafzatypro.com\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
