name: Remove archived manual APK assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-archived-manual-apks.yml'

permissions:
  contents: write

jobs:
  remove_archived_manual_apks:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete manual APKs from archived releases
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              for (const asset of release.assets.filter(item => item.name === "mohafzaty-pro-android-manual.apk")) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                core.info("Deleted manual APK asset from " + release.tag_name);
              }
            }
