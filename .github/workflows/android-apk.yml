# Trigger a fresh signed Android release build after the API 36/AAB setup.
name: Build Android APK and AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'site/.well-known/assetlinks.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install current Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-nodpi
          base64 --decode android/assets/mohafzatypro-icon-192.png.base64 > android/app/src/main/res/mipmap-nodpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-nodpi/ic_launcher.png
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert android/app/src/main/res/mipmap-nodpi/ic_launcher.png -strip -alpha on PNG32:/tmp/ic_launcher-normalized.png
          mv /tmp/ic_launcher-normalized.png android/app/src/main/res/mipmap-nodpi/ic_launcher.png
          file android/app/src/main/res/mipmap-nodpi/ic_launcher.png

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "::error::Missing ANDROID_STORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS repository secret" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android SDK tools
        run: |
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mohafzaty-release.jks"
          test -s "$RUNNER_TEMP/mohafzaty-release.jks"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mohafzaty-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle --no-daemon clean assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mohafzaty-pro-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/mohafzaty-pro-android.aab"

      - name: Verify APK and AAB signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/mohafzaty-pro-android.apk"
          jarsigner -verify "$GITHUB_WORKSPACE/mohafzaty-pro-android.aab"

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: محفظتي برو للأندرويد 1.0.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: |
            mohafzaty-pro-android.apk
            mohafzaty-pro-android.aab
