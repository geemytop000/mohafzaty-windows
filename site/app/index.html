<body style="margin:0;">
<div id="app" dir="rtl"><div class="boot">جارِ فتح الدفتر…</div></div>

<style>
#app{
  --paper:#EDE7D8;--paper-raised:#F6F1E4;--line:#D3C6A3;--line-soft:#E1D6B9;--border:#C4B689;
  --ink:#202B22;--ink-soft:#596153;--brass:#8C6E2F;--credit:#2F6F4E;--credit-bg:#E4EEE3;
  --debit:#8C3A2E;--debit-bg:#F1E2DC;--warn-bg:#F1E9D2;
  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--ink);background:var(--paper);
  min-height:100vh;direction:rtl;box-sizing:border-box;
}
#app *,#app *::before,#app *::after{box-sizing:border-box}
.num{font-family:'JetBrains Mono',Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.boot{padding:40px;text-align:center;color:var(--ink-soft)}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.head h1{font-size:21px;font-weight:900;margin:0 0 2px}
.head p{margin:0;color:var(--ink-soft);font-size:12.5px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:var(--paper-raised);white-space:nowrap}
.chip.ok{color:var(--credit);border-color:var(--credit)}
.chip.warn{color:var(--debit);border-color:var(--debit)}
.banner{border:1px solid var(--border);border-radius:4px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-bg);color:var(--brass)}
.banner.bad{background:var(--debit-bg);border-color:var(--debit);color:var(--debit)}
.banner button{width:auto!important;padding:5px 12px!important;font-size:12px!important;flex:none!important}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:16px;overflow-x:auto}
.tab{flex:1;min-width:64px;background:none;border:none;padding:9px 6px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-radius:3px 3px 0 0}
.tab.on{background:var(--ink);color:var(--paper-raised)}

.head-btns{display:flex;gap:8px;margin-bottom:16px}
.btn-add{flex:1;background:var(--ink);color:var(--paper-raised);border:none;border-radius:3px;padding:10px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:#34412F}
.btn-add.active{background:var(--debit)}
.btn-add.alt{background:var(--brass)}
.btn-add.alt.active{background:var(--debit)}

.hero{border-top:3px solid var(--brass);padding-top:14px;margin-bottom:4px}
.hero .label{font-size:13px;color:var(--ink-soft);margin-bottom:4px}
.hero .amount{font-size:38px;font-weight:700;line-height:1}
.hero .amount .cur{font-size:16px;color:var(--ink-soft);margin-right:8px}
.hero .amount.neg{color:var(--debit)}
.rule{border:none;border-top:1px dashed var(--line);margin:14px 0}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.box{background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:3px;padding:12px 10px}
.box .l{font-size:12px;color:var(--ink-soft);margin-bottom:5px}
.box .v{font-size:19px;font-weight:700}
.box.full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}
.stat{background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:3px;padding:11px 8px}
.stat .l{font-size:11px;color:var(--ink-soft);margin-bottom:5px}
.stat .v{font-size:15px;font-weight:700}
.stat.credit .v{color:var(--credit)}
.stat.debit .v{color:var(--debit)}
.sec-title{font-size:15px;font-weight:700;margin:18px 0 10px}
.card{background:var(--paper-raised);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:14px}
.card h3,.card h4{margin:0 0 10px;font-size:14.5px;font-weight:700}
.hint{font-size:12px;color:var(--ink-soft);line-height:1.7;margin:0 0 10px}
.bar{height:8px;background:var(--line-soft);border-radius:5px;overflow:hidden;margin:5px 0 10px}
.bar i{display:block;height:100%;background:var(--credit)}
.bar i.hi{background:var(--debit)}
.alert{background:var(--debit-bg);border:1px solid var(--debit);color:var(--debit);border-radius:4px;padding:8px 11px;font-size:12.5px;margin-bottom:10px}

.form-panel{background:var(--paper-raised);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:18px}
.form-panel h3{margin:0 0 12px;font-size:15px;font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--border);border-radius:3px;padding:9px 10px}
.field input[type=number]{font-family:'JetBrains Mono',Consolas,monospace;direction:ltr;text-align:right}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--paper);padding:9px 6px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.seg button+button{border-right:1px solid var(--border)}
.seg button.on.credit{background:var(--credit-bg);color:var(--credit)}
.seg button.on.debit{background:var(--debit-bg);color:var(--debit)}
.preview{display:none;font-size:12.5px;color:var(--brass);background:var(--warn-bg);border:1px dashed var(--border);border-radius:3px;padding:7px 9px;margin:-4px 0 12px}
.form-actions{display:flex;gap:8px;margin-top:12px}
.btn-save{flex:1;background:var(--brass);color:#fff;border:none;border-radius:3px;padding:11px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn-save:hover{background:#765D27}
.btn-save.dark{background:var(--ink)}
.btn-save.danger{background:var(--debit)}
.btn-save.green{background:var(--credit)}
.btn-save:disabled{opacity:.6;cursor:wait}
.err{color:var(--debit);font-size:12.5px;margin:-4px 0 10px}
.link{background:none;border:none;color:var(--brass);font-size:12.5px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:0}
.link.red{color:var(--debit)}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters input,.filters select{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper-raised);border-radius:3px;padding:8px 9px;color:var(--ink);width:100%}
.filters .wide{grid-column:1/-1}
.filters label.chk{grid-column:1/-1;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}

.ledger{border-top:2px solid var(--ink)}
.row-h,.row{display:grid;grid-template-columns:70px 96px 1fr 84px;gap:8px;padding:10px 4px;font-size:13.5px;align-items:center}
.row-h{font-size:11.5px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.row{border-bottom:1px dashed var(--line-soft);cursor:pointer}
.row:hover{background:rgba(140,110,47,.08)}
.row.voided{opacity:.5;text-decoration:line-through}
.row .date{color:var(--ink-soft);font-size:12px}
.row .type{font-size:11.5px;color:var(--ink-soft)}
.row .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .desc .note{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:left;font-weight:700}
.row .amt.credit{color:var(--credit)}
.row .amt.debit{color:var(--debit)}
.empty{text-align:center;padding:36px 10px;color:var(--ink-soft);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;color:var(--ink-soft);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:500}
.tbl td{padding:8px 4px;border-bottom:1px dashed var(--line-soft)}

.cust{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--line-soft)}
.cust .nm{font-weight:700;cursor:pointer}
.cust .sub{font-size:11.5px;color:var(--ink-soft)}
.cust .bal{text-align:left;font-weight:700}
.cust .bal.credit{color:var(--credit)}
.cust .bal.debit{color:var(--debit)}

.modal-overlay{position:fixed;inset:0;background:rgba(32,43,34,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;direction:rtl}
.modal-card{background:var(--paper-raised,#F6F1E4);border:1px solid var(--border,#C4B689);border-radius:6px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;padding:18px;color:#202B22}
.modal-card h3{margin:0 0 14px;font-size:16px;font-weight:700;border-bottom:2px solid #202B22;padding-bottom:10px}
.modal-card .field label{display:block;font-size:12.5px;color:#596153;margin-bottom:5px}
.modal-card .field input{width:100%;font-size:14px;padding:9px 10px;border:1px solid #C4B689;border-radius:3px;background:#EDE7D8;font-family:inherit}
.modal-card .err{color:#8C3A2E;font-size:12.5px;margin:0 0 10px;min-height:16px}
.modal-card .btn-save{width:100%;margin-bottom:8px;background:#8C6E2F;color:#fff;border:none;border-radius:3px;padding:11px;font-weight:700;font-family:inherit;cursor:pointer}
.modal-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px}
.modal-row .k{color:var(--ink-soft);white-space:nowrap}
.modal-row .v{font-weight:700;text-align:left}
.modal-row .v.credit{color:var(--credit)}
.modal-row .v.debit{color:var(--debit)}
.modal-notes{margin-top:12px;padding:10px 11px;background:var(--paper);border:1px solid var(--line-soft);border-radius:4px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.locked-note{margin-top:12px;font-size:12px;color:var(--ink-soft);text-align:center;padding:8px;background:var(--warn-bg);border-radius:3px}
.modal-close{margin-top:12px;width:100%;background:var(--ink);color:var(--paper-raised);border:none;border-radius:3px;padding:11px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202B22;color:#F6F1E4;padding:10px 18px;border-radius:4px;font-size:13.5px;z-index:3000;max-width:90vw;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;direction:rtl}
.lock{max-width:340px;margin:12vh auto;text-align:center;padding:20px}
.lock h1{font-size:22px;margin:0 0 6px}

@media (max-width:460px){
  .hero .amount{font-size:30px}
  .row-h,.row{grid-template-columns:58px 0 1fr 74px}
  .row-h .type,.row .type{display:none}
  .stats{grid-template-columns:1fr 1fr 1fr}
}
@media print{
  body.print-rep .wrap>*:not(.rep-print){display:none!important}
  body.print-rep .noprint{display:none!important}
  body.print-rep #app{background:#fff}
}

/* ---- واجهة أشيك ---- */
#app{background:radial-gradient(120% 60% at 50% 0%,#F7F2E6 0,#EDE7D8 60%,#E6DFCC 100%)}
.hero{background:linear-gradient(135deg,#17261d 0,#2f4a39 100%)!important;border:0!important;border-radius:22px!important;box-shadow:0 12px 30px rgba(23,38,29,.28)!important}
.hero .label{color:#d9cfae!important}
.hero .amount,.hero .amount .num,.hero .amount .cur{color:#fff!important}
.hero .amount.neg,.hero .amount.neg .num{color:#ffb4a5!important}
.box,.card,.stat,.form-panel{border-radius:18px!important;box-shadow:0 4px 16px rgba(32,43,34,.08);transition:transform .15s,box-shadow .15s}
.box:hover,.stat:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(32,43,34,.12)}
.btn-add{border-radius:14px!important;box-shadow:0 3px 10px rgba(32,43,34,.15);transition:transform .08s,filter .15s}
.btn-save,.modal-close{border-radius:14px!important;background-image:linear-gradient(135deg,#2F6F4E,#3b8a63)!important;color:#fff!important;transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.06)}
input,select,textarea{border-radius:12px!important}
.sec-card .box .l span{font-size:12px}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}

/* ---- تصميم احترافي ---- */
html,body{overflow-x:hidden}
.wrap{padding-bottom:120px}
.head h1{letter-spacing:.2px}
.tabs{border-bottom:0!important;background:#E3DCC7;border-radius:16px;padding:4px;gap:4px;margin-bottom:16px}
.tab{border:0!important;border-radius:12px!important;padding:10px 4px!important;font-weight:700;transition:background .15s}
.tab.on{background:#2f4a39!important;color:#fff!important;box-shadow:0 4px 12px rgba(47,74,57,.35)}
.head-btns{flex-wrap:wrap;gap:10px;margin-bottom:18px}
.btn-add{flex:1 1 calc(50% - 10px)!important;min-width:140px;padding:13px 10px!important;font-size:14px!important}
.btn-add.alt{background:#fff!important;color:#2f4a39!important;border:1.5px solid #2f4a39!important}
.hero{padding:20px 18px!important}
.hero .amount{font-size:clamp(30px,9vw,42px)!important;line-height:1.1}
.split{gap:12px!important;margin-bottom:12px!important}
.box{padding:14px 14px!important;background:#fff!important;border:1px solid #E3DCC7!important}
.box .l{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.box .v{font-size:22px!important;margin-top:6px}
.ed{font-style:normal;cursor:pointer;opacity:.4;font-size:12px;padding:2px 5px;border-radius:6px}
.ed:hover{opacity:1;background:#EDE7D8}
.fab{position:fixed;left:14px;bottom:14px;z-index:9999;width:42px;height:42px;border-radius:50%;border:0;color:#fff;font-size:18px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28);background:#2F6F4E}
.mdl-ov{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,32,26,.6);backdrop-filter:blur(3px)}
.mdl{background:#F9F5EA;border-radius:22px;padding:22px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mdl h3{margin:0 0 12px;font-size:18px}
.mdl label{display:block;font-size:13px;color:#596153;margin:10px 0 4px}
.mdl input{width:100%;box-sizing:border-box;padding:13px;border:1.5px solid #D7CBA5;border-radius:12px;font-size:16px;font-family:inherit;background:#fff}
.mdl input:focus{outline:none;border-color:#2F6F4E;box-shadow:0 0 0 3px rgba(47,111,78,.15)}
.mdl-b{display:flex;gap:10px;margin-top:16px}
.mdl-b button,.mdl-row{flex:1;padding:13px;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.mdl-ok{background:linear-gradient(135deg,#2F6F4E,#3b8a63);color:#fff}
.mdl-x{background:#E3DCC7;color:#202B22}
.mdl-row{display:block;width:100%;margin-top:8px;background:#fff;border:1.5px solid #E3DCC7!important;text-align:right}
.mdl-row.on{border-color:#2F6F4E!important;background:#EAF3EC}

@media (max-width:460px){
.row-h,.row{grid-template-columns:64px 1fr 88px!important}
.row-h div:nth-child(2){display:none}
.row .desc .note{white-space:normal}
}

.sec-set{margin:6px 0 12px}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;margin-top:8px;background:#fff;border:1px solid #E3DCC7;border-radius:14px}
.sec-row .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.sec-act{display:flex;gap:6px}
.mini{border:0;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;background:#E3DCC7;color:#202B22}
.mini.ok{background:#2F6F4E;color:#fff}
.mini.del{background:#F3DDD6;color:#8C3A2E}

/* ---- أنماط إيصالات الكاشير الحرارية والطباعة ---- */
@media print {
  body.print-receipt .wrap, body.print-receipt .fab, body.print-receipt .modal-overlay, body.print-receipt .toast { display:none!important; }
  body.print-receipt #thermalReceiptArea, body.print-receipt #thermalReceiptArea * { display:block!important; }
  body.print-receipt { background:#fff!important; width:76mm!important; margin:0 auto!important; padding:4mm!important; color:#000!important; }
  .thermal-receipt { font-family:'JetBrains Mono','Courier New',monospace; font-size:12px; line-height:1.4; text-align:center; direction:rtl; }
  .thermal-receipt .rc-divider { border-top:1px dashed #000; margin:6px 0; }
  .thermal-receipt .rc-row { display:flex; justify-content:space-between; font-size:11.5px; margin:3px 0; }
  .thermal-receipt .rc-title { font-size:15px; font-weight:900; margin:4px 0; }
  .thermal-receipt .rc-bold { font-weight:bold; }
  .thermal-receipt .rc-qr { margin:8px auto; font-size:9.5px; word-break:break-all; border:1px solid #000; padding:4px; max-width:85%; }
}
#thermalReceiptArea { display:none; }
.chip-tenant { background:linear-gradient(135deg,#8C6E2F,#a68339); color:#fff; cursor:pointer; font-weight:700; border:0; padding:4px 10px; border-radius:12px; }
.chip-user { background:linear-gradient(135deg,#2F6F4E,#3b8a63); color:#fff; cursor:pointer; font-weight:700; border:0; padding:4px 10px; border-radius:12px; }

/* =========================================================
   Hash / License
========================================================= */
function cyrb53(str, seed) {
  seed = seed || 0;
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
async function sha256(str) {
  try {
    if (window.crypto && window.crypto.subtle && typeof TextEncoder !== 'undefined') {
      const b = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* fallback below */ }
  return 'c' + cyrb53(str).toString(16) + cyrb53(str, 9).toString(16);
}
async function verifyLic(id, code) {
  try {
    if (!code || !window.crypto || !crypto.subtle) return false;
    const cleanCode = String(code).trim();

    // 1. فحص رمز ترخيص SaaS المنظم (SAAS.<payload>.<signature>)
    if (cleanCode.startsWith('SAAS.') || cleanCode.startsWith('saas.')) {
      const parts = cleanCode.split('.');
      if (parts.length === 3) {
        const key = await crypto.subtle.importKey('jwk', SAAS_LIC_PUB, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
        const sig = Uint8Array.from(atob(parts[2].replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
        const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, new TextEncoder().encode('SAAS|' + parts[1]));
        if (ok) {
          const payloadStr = new TextDecoder().decode(Uint8Array.from(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));
          const payload = JSON.parse(payloadStr);
          if (payload.deviceId && id && payload.deviceId.trim().toUpperCase() !== id.trim().toUpperCase()) {
            state.license.valid = false;
            return false;
          }
          if (payload.status === 'revoked' || payload.revoked === true) {
            state.license.valid = false;
            state.license.expired = true;
            state.license.revoked = true;
            state.license.plan = 'revoked';
            state.license.planLabel = 'اشتراك ملغى وموقوف';
            state.license.expiresAt = 0;
            return false;
          }
          if (payload.expiresAt && Date.now() > payload.expiresAt) {
            state.license.valid = false;
            state.license.expired = true;
            state.license.plan = payload.plan;
            state.license.planLabel = payload.planLabel || payload.plan;
            state.license.expiresAt = payload.expiresAt;
            return false;
          }
          state.license.valid = true;
          state.license.expired = false;
          state.license.plan = payload.plan || 'pro_yearly';
          state.license.planLabel = payload.planLabel || (payload.plan === 'monthly' ? 'اشتراك شهري تجاري' : payload.plan === 'yearly' ? 'اشتراك سنوي احترافي' : 'ترخيص تجاري دائم');
          state.license.expiresAt = payload.expiresAt || 0;
          state.license.maxBranches = payload.maxBranches || 5;
          return true;
        }
      }
    }

    // 2. فحص تراخيص المدة المدمجة (EXP<YYYYMMDD>-<sig>)
    const mExp = /^EXP(\d{4})(\d{2})(\d{2})-(.+)$/.exec(cleanCode);
    if (mExp && id) {
      const expDate = mExp[1] + '-' + mExp[2] + '-' + mExp[3];
      const expTs = new Date(expDate + 'T23:59:59').getTime();
      const key = await crypto.subtle.importKey('jwk', LIC_PUB, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      let b64 = mExp[4].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const sig = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, new TextEncoder().encode('LIC|' + id + '|' + expDate));
      if (ok) {
        if (Date.now() > expTs) {
          state.license.valid = false;
          state.license.expired = true;
          state.license.expiresAt = expTs;
          return false;
        }
        state.license.valid = true;
        state.license.expired = false;
        state.license.plan = 'monthly';
        state.license.planLabel = 'اشتراك تجاري محدد المدة';
        state.license.expiresAt = expTs;
        return true;
      }
    }

    // 3. فحص التراخيص الدائمة المتوافقة (LIC|<id>)
    if (id) {
      const key = await crypto.subtle.importKey('jwk', LIC_PUB, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const sig = Uint8Array.from(atob(cleanCode.replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
      const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, new TextEncoder().encode('LIC|' + id));
      if (ok) {
        state.license.valid = true;
        state.license.expired = false;
        state.license.plan = 'lifetime';
        state.license.planLabel = 'ترخيص تجاري دائم';
        state.license.expiresAt = 0;
        return true;
      }
    }
  } catch (e) { return false; }
  return false;
}


/* =========================================================
   المزامنة السحابية المباشرة للتراخيص (تحديث وإلغاء فوري بدون كود)
========================================================= */
let _lastLiveCheck = 0;
async function checkLiveLicense(force) {
  if (!LICENSING_ENABLED) return;
  const now = Date.now();
  if (!force && now - _lastLiveCheck < 10000) return; // منع التكرار الزائد
  _lastLiveCheck = now;
  const hub = getCloudHubUrl();
  const devId = state.license && state.license.deviceId;
  if (!hub || !devId || typeof fetch !== 'function') return;
  try {
    const cleanHub = hub.replace(/\/+$/, '');
    const res = await fetch(cleanHub + '/licenses/' + encodeURIComponent(devId) + '.json', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (!data || typeof data !== 'object') return;

    // 1. إذا كان الترخيص ملغى سحابياً من البائع
    if (data.status === 'revoked' || data.revoked === true) {
      if (state.license.valid || !state.license.revoked) {
        state.license.valid = false;
        state.license.revoked = true;
        state.license.expired = true;
        state.license.plan = 'revoked';
        state.license.planLabel = 'اشتراك ملغى وموقوف 🚫';
        state.license.expiresAt = 0;
        await persist('license');
        toast('تم إيقاف وإلغاء ترخيص هذا الجهاز من قبل الإدارة 🚫');
        render();
      }
      return;
    }

    // 2. إذا تم تعديل المدة أو التجديد سحابياً بدون كود
    if (data.code) {
      const valid = await verifyLic(devId, data.code);
      if (valid) {
        /* المدة والخطة بتتاخد من الكود الموقّع نفسه (verifyLic حدّثتها) — مش من قيم غير موقّعة */
        const changed = (state.license.key !== data.code) || (state.license.revoked === true);
        if (changed) {
          state.license.key = data.code;
          state.license.valid = true;
          state.license.revoked = false;
          state.license.expired = false;
          await persist('license');
          toast('تم تحديث مدة اشتراكك تلقائياً سحابياً ✅ (' + (state.license.planLabel || '') + ')');
          render();
        }
      }
    } else if (data.expiresAt !== undefined && data.expiresAt !== state.license.expiresAt) {
      /* بدون كود موقّع: مسموح بتقصير المدة فقط. التمديد أو منح ترخيص لازم كود موقّع. */
      const cur = state.license.expiresAt || 0;
      const shortens = state.license.valid === true && Number(data.expiresAt) > 0 && (cur === 0 || Number(data.expiresAt) < cur);
      if (!shortens) return;
      state.license.expiresAt = Number(data.expiresAt);
      state.license.planLabel = data.planLabel || state.license.planLabel;
      state.license.valid = Date.now() < state.license.expiresAt;
      await persist('license');
      toast('تم تحديث مدة اشتراكك سحابياً ✅ (' + (state.license.planLabel || '') + ')');
      render();
    }
  } catch (e) {
    // وضع Offline-First: يظل التطبيق شغالاً محلياً بدون أي انقطاع
  }
}

function subscriptionInfo() {
  if (!LICENSING_ENABLED) return { status: 'active', plan: 'free', label: 'حساب مجاني', daysLeft: Infinity, text: 'حساب مجاني ✓' };
  if (state.license && state.license.revoked) {
    return { status: 'expired', plan: 'revoked', label: 'ملغى 🚫', daysLeft: 0, text: 'اشتراك ملغى وموقوف 🚫' };
  }
  if (isLicensed()) {
    if (state.license.expiresAt > 0) {
      const days = Math.ceil((state.license.expiresAt - Date.now()) / 86400000);
      return { status: 'active', plan: state.license.plan, label: state.license.planLabel || 'اشتراك سارٍ', daysLeft: days, text: (state.license.planLabel || 'اشتراك سارٍ') + ' (باقي ' + days + ' يوم)' };
    }
    return { status: 'active', plan: 'lifetime', label: state.license.planLabel || 'ترخيص تجاري دائم', daysLeft: Infinity, text: state.license.planLabel || 'ترخيص تجاري دائم' };
  }
  if (trialDaysLeft() > 0) {
    return { status: 'trial', plan: 'trial', label: 'تجربة مجانية', daysLeft: trialDaysLeft(), text: 'تجريبي: باقي ' + trialDaysLeft() + ' يوم' };
  }
  return { status: 'expired', plan: 'none', label: 'منتهي', daysLeft: 0, text: 'انتهت الفترة التجريبية' };
}
function isLicensed() {
  if (!LICENSING_ENABLED) return true;
  if (state.license.valid === true) {
    if (state.license.expiresAt && Date.now() > state.license.expiresAt) {
      state.license.valid = false;
      state.license.expired = true;
      return false;
    }
    return true;
  }
  return false;
}
function trialDaysLeft() {
  const now = Math.max(Date.now(), state.license.lastSeen || 0);
  return Math.ceil(TRIAL_DAYS - (now - state.license.first) / 86400000);
}
function canWrite() {
  if (state.restoring) { toast('الاسترجاع شغال - حاول بعد قليل'); return false; }
  if (!LICENSING_ENABLED) return true;
  if (state.license && state.license.revoked) {
    toast('تم إيقاف وإلغاء ترخيص هذا الجهاز — يرجى مراجعة إدارة المبيعات للتجديد');
    return false;
  }
  if (isLicensed() || trialDaysLeft() > 0) return true;
  toast('انتهت الفترة التجريبية - فعّل النسخة عشان تسجّل عمليات جديدة (بياناتك محفوظة وتقدر تصدّرها)');
  return false;
}

}
async function setCategoryPassword(category, pw) {
  state.settings.passwords = state.settings.passwords || {};
  const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const hash = await sha256(salt + '|' + pw);
  state.settings.passwords[category] = { hash, salt };
  return persist('settings');
}
async function verifyPw(pw, category) {
  if (state.settings.customPasswordsEnabled && category && state.settings.passwords && state.settings.passwords[category] && state.settings.passwords[category].hash) {
    const item = state.settings.passwords[category];
    if ((await sha256(item.salt + '|' + pw)) === item.hash) return true;
    // مسار تجاوز آمن للمدير بكلمة السر العامة
    if (state.settings.pwHash && (await sha256(state.settings.pwSalt + '|' + pw)) === state.settings.pwHash) {
      return true;
    }
    return false;
  }
  if (!state.settings.pwHash) return false;
  return (await sha256(state.settings.pwSalt + '|' + pw)) === state.settings.pwHash;
}

/* =========================================================
   Storage
========================================================= */
async function cloudGet(key) {
  if (!window.storage || typeof window.storage.get !== 'function') return null;
  try {
    const r = await window.storage.get(key, false);
    return (r && typeof r.value === 'string') ? r.value : null;
  } catch (e) { return null; }
}
async function cloudSet(key, value) {
  if (!window.storage || typeof window.storage.set !== 'function') return false;
  try {
    const r = await window.storage.set(key, value, false);
    return r !== null && r !== undefined && typeof r === 'object';
  } catch (e) { return false; }
}
function localGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { console.error(e); return false; } }

async function sGet(key) {
  const lv = localGet(key);
  if (lv !== null) return lv;
  const cv = await cloudGet(key);
  if (cv !== null) { localSet(key, cv); return cv; }
  return null;
}
/* طبقة الحفظ: التخزين المحلي هو المرجع الأساسي، والسحابي نسخة مرآة (best-effort).
   نجاح الحفظ = نجاح الكتابة المحلية + قراءة مطابقة. فشل السحابي لا يُبلَّغ كنجاح كامل: يُسجَّل «السحابة قديمة» ويُنبَّه المستخدم.
   لو التخزين المحلي غير متاح أصلًا في البيئة (probe فاشل) تصبح السحابة هي المرجع ويُتحقق منها بالقراءة.
   تنبيه: لا توجد ذرّية حقيقية بين المفاتيح؛ التراجع محاولة مُتحقَّق منها وليس ضمانًا. */
const LOCAL_OK = (function () { try { const k = '__wl_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
const DIRTY_KEY = 'wl:clouddirty:' + PROFILE, RESTORE_MARK = 'wl:restoring:' + PROFILE;
const hasCloudApi = () => !!(window.storage && typeof window.storage.set === 'function');
function getDirty() { try { return JSON.parse(localStorage.getItem(DIRTY_KEY) || '[]'); } catch (e) { return []; } }
function setDirty(key, on) { try { const st = new Set(getDirty()); if (on) st.add(key); else st.delete(key); localStorage.setItem(DIRTY_KEY, JSON.stringify(Array.from(st))); } catch (e) {} }
async function cloudDel(key) {
  if (!window.storage || typeof window.storage.delete !== 'function') return false;
  try { await window.storage.delete(key, false); return true; } catch (e) { return false; }
}
const cloudStat = { warned: false, last: {} };
async function sSet(key, value) {
  if (LOCAL_OK) {
    if (!(localSet(key, value) && localGet(key) === value)) return { ok: false, local: false, cloud: 'skipped' };
    if (!hasCloudApi()) return { ok: true, local: true, cloud: 'na' };
    return { ok: true, local: true, cloud: (await cloudSet(key, value)) ? 'ok' : 'fail' };
  }
  if (!hasCloudApi()) return { ok: false, local: false, cloud: 'na' };
  const c = (await cloudSet(key, value)) && (await cloudGet(key)) === value;
  return { ok: c, local: false, cloud: c ? 'ok' : 'fail' };
}
async function persistLocal(name) {
  const map = { txns: state.txns, opening: state.opening, settings: state.settings, closings: state.closings, audit: state.audit, license: state.license };
  const r = await sSet(K[name], JSON.stringify(map[name]));
  cloudStat.last[K[name]] = r.cloud;
  if (r.ok && LOCAL_OK) {
    if (r.cloud === 'fail') {
      setDirty(K[name], true);
      if (!cloudStat.warned) { cloudStat.warned = true; try { toast('اتحفظ على الجهاز، لكن تعذر تحديث النسخة السحابية'); } catch (e) {} }
    } else if (r.cloud === 'ok') setDirty(K[name], false);
  }
  return r.ok;
}
function audit(action, info) {
  state.audit.push({ at: Date.now(), action, info: info || '' });
  if (state.audit.length > 5000) state.audit = state.audit.slice(-5000);
  persist('audit');
}

/* IndexedDB (مقبض مجلد الحفظ التلقائي) */
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(v, k);
      tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
    });
  } catch (e) { return false; }
}
async function idbGet(k) {
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(k);
      r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
    });
  } catch (e) { return null; }
}

/* =========================================================
   Ledger math (متوافق مع البيانات القديمة)
========================================================= */
function getPayments(t) {
  if (Array.isArray(t.payments)) return t.payments;
  if (t.settled) return [{ id: 'legacy_settled', date: t.date, amount: Number(t.amount) || 0 }];
  return [];
}
function paidTotal(t) { return getPayments(t).reduce((s, p) => s + (Number(p.amount) || 0), 0); }
function remainingAmount(t) { return round2((Number(t.amount) || 0) - paidTotal(t)); }
function isFullySettled(t) { return remainingAmount(t) <= 0.004; }
function creditBaseAmount(t) {
  return (t.baseAmount !== undefined && t.baseAmount !== null) ? Number(t.baseAmount) || 0 : Number(t.amount) || 0;
}
function ledgerBaseEffect(t) {
  const rem = remainingAmount(t);
  if (t.type === 'دائن') return -Math.min(rem, creditBaseAmount(t));
  if (t.type === 'مدين') return rem;
  return 0;
}
function ledgerEffects(t) {
  const v = ledgerBaseEffect(t), src = ledgerSource(t);
  return { drawer: src === 'drawer' ? v : 0, phone: src === 'phone' ? v : 0, commission: src === 'commission' ? v : 0 };
}
function rowSign(t) {
  if (t.type === 'فوري' || t.type === 'تحويل قسم') return { sign: '', cls: '' };
  if (t.type === 'عمولة') return (Number(t.amount) || 0) < 0 ? { sign: '−', cls: 'debit' } : { sign: '+', cls: 'credit' };
  if (t.type === 'دائن') return { sign: '+', cls: 'credit' };
  if (t.type === 'مدين') return { sign: '−', cls: 'debit' };
  const d = Number(t.drawerDelta) || 0, p = Number(t.phoneDelta) || 0;
  const net = d !== 0 ? d : p;
  if (net > 0) return { sign: '+', cls: 'credit' };
  if (net < 0) return { sign: '−', cls: 'debit' };
  return { sign: '', cls: '' };
}
function moveNote(t) {
  let n = moveNoteBase(t);
  if (t.acct && t.type !== 'تحويل قسم') {
    const ps = Object.keys(t.acct).map(function (k) { return secName(k) + ' ' + (t.acct[k] > 0 ? '+' : '−') + fmt(Math.abs(t.acct[k])); });
    n = (n ? n + ' · ' : '') + ps.join(' · ');
  }
  return n;
}
function moveNoteBase(t) {
  if (isVoided(t)) return 'ملغاة' + (voidReasonOf(t) ? ' — ' + voidReasonOf(t) : '');
  if (t.type === 'دائن' || t.type === 'مدين') {
    const srcLabel = sourceLabel(ledgerSource(t));
    const base = creditBaseAmount(t), amt = Number(t.amount) || 0;
    const cn = (t.type === 'دائن' && base < amt) ? ' · عمولة ' + fmt(amt - base) + ' اتقيدت فورًا في خانة العمولة' : '';
    if (isFullySettled(t)) return 'تمت التسوية بالكامل - ' + srcLabel + ' رجع لوضعه الطبيعي' + cn;
    const eff = ledgerBaseEffect(t), paid = paidTotal(t);
    return 'المتبقي ' + fmt(remainingAmount(t)) + ' من أصل ' + fmt(amt) + ' · ' + srcLabel + ' ' + (eff > 0 ? '+' : '−') + fmt(Math.abs(eff)) + (paid > 0 ? ' (بعد سداد ' + fmt(paid) + ')' : '') + cn;
  }
  if (t.type === 'تصحيح') {
    const f = t.fx || {}, nm = { drawer: 'الدرج', phone: 'التلفون', commission: 'العمولة', fawry: 'فوري', credit: 'الدائن', debit: 'المدين' };
    const ps = Object.keys(nm).filter(k => Number(f[k])).map(k => nm[k] + ' ' + (f[k] > 0 ? '+' : '−') + fmt(Math.abs(f[k])));
    return 'قيد عكسي للعملية الأصلية' + (ps.length ? ' · ' + ps.join(' · ') : '') + (t.reason ? ' — ' + t.reason : '');
  }
  if (t.type === 'تحويل قسم') return secName(t.from) + ' ← ' + secName(t.to);
  if (t.type === 'فوري') return isFullySettled(t) ? 'رجع بالكامل للدرج ✅' : 'المتبقي في المكنة ' + fmt(remainingAmount(t)) + ' من أصل ' + fmt(Number(t.amount) || 0) + (paidTotal(t) > 0 ? ' · رجع للدرج ' + fmt(paidTotal(t)) : '');
  if (t.type === 'عمولة') { const ca = Number(t.amount) || 0; return 'العمولة ' + (ca < 0 ? '−' : '+') + fmt(Math.abs(ca)) + ' (خانة منفصلة عن الدرج الرئيسي)'; }
  const d = Number(t.drawerDelta) || 0, p = Number(t.phoneDelta) || 0, parts = [];
  if (d !== 0) parts.push('الدرج ' + (d > 0 ? '+' : '−') + fmt(Math.abs(d)));
  if (p !== 0) parts.push('التلفون ' + (p > 0 ? '+' : '−') + fmt(Math.abs(p)));
  return parts.join(' · ');
}

function secName(id) {
  if (id === 'drawer') return 'الدرج';
  if (id === 'phone') return 'التلفون';
  if (id === 'ext') return 'خارج الدفتر';
  if (typeof id === 'string') {
    const wid = id.startsWith('w:') ? id.slice(2) : id;
    const w = (typeof getWallets === 'function') ? getWallets().find(x => x.id === wid) : null;
    if (w && (id.startsWith('w:') || w.id === id)) {
      return (w.label ? w.label + ' (' + w.phone + ')' : w.phone);
    }
  }
  const a = (S().sections || []).find(x => x.id === id);
  return a ? a.name : 'قسم محذوف';
}
function hasPay(t) { return t.type === 'دائن' || t.type === 'مدين' || t.type === 'فوري'; }
function plainFx(t) {
  if (t.type === 'فوري') return { drawer: paidTotal(t) - (Number(t.amount) || 0), phone: 0, fawry: remainingAmount(t), acct: {}, commission: 0 };
  return { drawer: Number(t.drawerDelta) || 0, phone: Number(t.phoneDelta) || 0, fawry: 0, acct: t.acct || {}, commission: 0 };
}

function computeTotals(list) {
  let credit = 0, debit = 0, commissionMonth = 0, commissionAcc = 0, dDelta = 0, pDelta = 0, fDelta = 0, acctSum = 0;
  const acctB = {};
  for (const t of list) {
    const a = Number(t.amount) || 0;
    if (t.type === 'دائن') credit += remainingAmount(t);
    if (t.type === 'مدين') debit += remainingAmount(t);
    if (t.type === 'دائن' || t.type === 'مدين') {
      const e = ledgerEffects(t);
      dDelta += e.drawer; pDelta += e.phone; commissionAcc += e.commission;
    } else if (t.type === 'عمولة') {
      commissionAcc += a;
      if (isCurrentMonth(t.date)) commissionMonth += a;
    } else {
      const fx = plainFx(t);
      dDelta += fx.drawer; pDelta += fx.phone; fDelta += fx.fawry;
      for (const k in fx.acct) { acctB[k] = round2((acctB[k] || 0) + (Number(fx.acct[k]) || 0)); acctSum += Number(fx.acct[k]) || 0; }
    }
  }
  const drawerBalance = (Number(state.opening.drawer) || 0) + dDelta;
  const phoneBalance = (Number(state.opening.phone) || 0) + pDelta;
  return {
    credit, debit, commissionMonth, commissionAccumulated: commissionAcc,
    drawerBalance, phoneBalance, fawryBalance: fDelta, acctB, totalCapital: drawerBalance + commissionAcc + phoneBalance + fDelta + acctSum
  };
}
function totals() { return computeTotals(active()); }

function customers() {
  const m = new Map();
  active().filter(t => t.type === 'دائن' || t.type === 'مدين').forEach(t => {
    const key = (t.name || '').trim(); if (!key) return;
    let c = m.get(key);
    if (!c) { c = { name: key, lent: 0, borrowed: 0, phone: '', last: '' }; m.set(key, c); }
    const r = remainingAmount(t);
    if (t.type === 'دائن') c.lent += r; else c.borrowed += r;
    if (t.phone) c.phone = t.phone;
    if (t.date > c.last) c.last = t.date;
  });
  return Array.from(m.values())
    .map(c => Object.assign({}, c, { lent: round2(c.lent), borrowed: round2(c.borrowed) }))
    .filter(c => c.lent > 0.004 || c.borrowed > 0.004)
    .sort((a, b) => (b.lent + b.borrowed) - (a.lent + a.borrowed));
}

function filteredTxns() {
  const f = state.filters;
  return state.txns
    .filter(t => f.showVoided || !isVoided(t))
    .filter(t => !f.type || t.type === f.type)
    .filter(t => !f.walletId || t.walletId === f.walletId || t.fromWalletId === f.walletId)
    .filter(t => !f.from || t.date >= f.from)
    .filter(t => !f.to || t.date <= f.to)
    .filter(t => !f.search || (t.name || '').includes(f.search) || (t.notes || '').includes(f.search) || (t.ref && t.ref.includes(f.search)) || timeSearchStr(t).includes(f.search))
    .slice()
    .sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
}

function askPw(reason, category) {

    const lbl = (state.settings.customPasswordsEnabled && category) ? 'كلمة سر (' + esc(catLabel(category)) + ')' : 'كلمة السر';
    const ov = modalShell(
      '<h3>' + esc(reason || 'تأكيد كلمة السر') + '</h3>' +

    async function ok() {

        return;
      }
      if (await verifyPw(inp.value, category)) {
        state.failCount = 0;
        if (!state.settings.customPasswordsEnabled) {
          state.authUntil = Date.now() + 5 * 60 * 1000;
        } else {
          state.authCategories = state.authCategories || {};
          state.authCategories[category || 'master'] = Date.now() + 5 * 60 * 1000;
        }
        done(true);
      } else {

        err.textContent = 'كلمة السر غلط'; inp.value = ''; inp.focus();
      }
    }
    ov.querySelector('#pwOk').onclick = ok;
    ov.querySelector('#pwCancel').onclick = () => done(false);
    inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}
async function requireAuth(reason, category) {
  if (state.authUntil === Infinity) return true;
  if (!state.settings.customPasswordsEnabled) {
    if (Date.now() < state.authUntil) return true;
  } else {
    if (state.authCategories && state.authCategories[category] && Date.now() < state.authCategories[category]) {
      return true;
    }
  }
  return askPw(reason, category);
}

/* =========================================================
   Load
========================================================= */
const isObj = v => typeof v === 'object' && v !== null && !Array.isArray(v);
async function loadJSON(key, fallback, isOk) {
  const tryParse = raw => {
    if (raw === null || raw === undefined || raw === '') return { empty: true };
    try { const v = JSON.parse(raw); return (v == null || (isOk && !isOk(v))) ? { bad: true } : { v: v }; } catch (e) { return { bad: true }; }
  };
  const quarantine = (raw, where) => {
    try { localStorage.setItem(key + ':corrupt:' + Date.now() + ':' + where, raw); } catch (e) {}
    console.warn('بيانات تالفة في', key, where);
    setTimeout(() => { try { toast('⚠️ بيانات تالفة اتلقت وتم حفظ نسخة منها (' + key + ')'); } catch (e) {} }, 700);
  };
  const lraw = LOCAL_OK ? localGet(key) : null, l = tryParse(lraw);
  if (l.v !== undefined) return l.v;
  const craw = await cloudGet(key), c = tryParse(craw);
  if (l.bad) quarantine(lraw, 'local');
  if (c.v !== undefined) { if (LOCAL_OK) localSet(key, craw); return c.v; }
  if (c.bad) quarantine(craw, 'cloud');
  return fallback;
}

async function reconcileStores() {
  try {
    if (!LOCAL_OK || !hasCloudApi() || typeof window.storage.get !== 'function') return;
    const dirty = getDirty(), diffs = [];
    for (const n of ['txns', 'opening', 'settings', 'closings', 'audit']) {
      const key = K[n], lraw = localGet(key);
      let craw = null, cloudErr = false;
      try { const r = await window.storage.get(key, false); craw = (r && typeof r.value === 'string') ? r.value : null; } catch (e) { craw = null; }
      if (lraw === craw) { if (dirty.includes(key)) setDirty(key, false); continue; }
      if (lraw === null) continue;
      if (craw === null || dirty.includes(key)) { if (await cloudSet(key, lraw)) setDirty(key, false); continue; }
      let note = n;
      if (n === 'txns') {
        try { const lo = new Set(JSON.parse(lraw).map(x => x.id)), co = new Set(JSON.parse(craw).map(x => x.id)); note += ' (محلي فقط ' + Array.from(lo).filter(i => !co.has(i)).length + ' | سحابي فقط ' + Array.from(co).filter(i => !lo.has(i)).length + ')'; } catch (e) {}
      }
      diffs.push(note);
    }
    if (diffs.length) {
      audit('storage-conflict', 'النسخة المحلية تختلف عن السحابية: ' + diffs.join('، ') + ' — تم الإبقاء على المحلية دون الكتابة فوق السحابية');
      setTimeout(() => { try { toast('⚠️ البيانات المحلية تختلف عن النسخة السحابية — الإبقاء على المحلية، راجع سجل التدقيق'); } catch (e) {} }, 800);
    }
  } catch (e) { console.warn(e); }
}
async function load() {
  const tx = await loadJSON(K.txns, [], Array.isArray);
  state.txns = Array.isArray(tx) ? tx : [];
  const op = await loadJSON(K.opening, { drawer: 0, phone: 0 }, isObj);
  state.opening = { drawer: Number(op.drawer) || 0, phone: Number(op.phone) || 0 };
  const st = await loadJSON(K.settings, {}, isObj);
  state.settings = Object.assign({}, DEFAULTS, st);
  if (!Array.isArray(state.settings.people)) state.settings.people = [];
  state.pendingImports = readPendingImports();
  if (new URLSearchParams(location.search).get('section') === 'review') state.tab = 'review';
  const cl = await loadJSON(K.closings, [], Array.isArray);
  state.closings = Array.isArray(cl) ? cl : [];
  const au = await loadJSON(K.audit, [], Array.isArray);
  state.audit = Array.isArray(au) ? au : [];

  const lic = await loadJSON(K.license, null);
  const now = Date.now();
  if (lic && lic.deviceId) {
    state.license = Object.assign({ key: '', lastSeen: 0 }, lic);
  } else {
    state.license = {
      deviceId: 'D' + Math.random().toString(36).slice(2, 8).toUpperCase() + now.toString(36).slice(-4).toUpperCase(),
      first: now, lastSeen: now, key: ''
    };
  }
  state.license.lastSeen = Math.max(state.license.lastSeen || 0, now);
  state.license.valid = await verifyLic(state.license.deviceId, state.license.key);
  await persist('license');

  state.draftMain.name = (state.settings.people && state.settings.people[0]) || '';
  state.draftLedger.name = '';
  document.title = 'محفظتي برو';

  consumeIncomingTransfer();
  state.loading = false;
  initSnaps();
  render();

  if (!state.settings.pwHash) {
    const hasData = state.txns.length > 0 || state.opening.drawer || state.opening.phone;
    /* مفيش كلمة سر افتراضية أبداً: لازم المستخدم يحدد كلمة سر جديدة (حتى لو فيه بيانات قديمة) */
    await firstRunSetup();
    document.title = 'محفظتي برو';
  }
  if (state.settings.lockOnOpen) state.locked = true;
  if (LOCAL_OK && localGet(RESTORE_MARK)) {
    audit('restore-incomplete', 'استرجاع سابق لم يكتمل أو تعذر التأكد من الرجوع عنه — راجع ملف pre-restore-backup');
    setTimeout(() => { try { toast('⚠️ استرجاع سابق لم يكتمل — راجع البيانات واستخدم ملف pre-restore-backup لو لزم'); } catch (e) {} }, 800);
    try { localStorage.removeItem(RESTORE_MARK); } catch (e) {}
  }
  await reconcileStores();

  await initFolder();
  render();
  if (state.folder.status === 'granted') autoExport();
  setTimeout(checkLiveLicense, 1500);
  setInterval(checkLiveLicense, 30000);
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkLiveLicense(); });
  }
}

function getWallets() {
  const w = S().wallets;
  if (Array.isArray(w) && w.length) return w;
  return [{
    id: 'w_default',
    phone: 'الخط الرئيسي',
    label: 'المحفظة الأساسية',
    openingBalance: Number(state.opening.phone) || 0,
    dailyLimit: Number(S().limitOut) || 0,
    monthlyLimit: Number(S().limitIn) || 0
  }];
}

function getActiveWalletId() {
  const ws = getWallets();
  if (S().activeWalletId && ws.some(w => w.id === S().activeWalletId)) {
    return S().activeWalletId;
  }
  return ws[0].id;
}

function getActiveWallet() {
  const wid = getActiveWalletId();
  return getWallets().find(w => w.id === wid) || getWallets()[0];
}

function setActiveWallet(wid) {

  state.draftMain.walletId = wid;
  persist('settings');
  const w = getWallets().find(x => x.id === wid);

  render();
}

function getWalletStats(wid) {
  const ws = getWallets();
  const w = ws.find(x => x.id === wid) || ws[0];
  if (!w) return { balance: 0, usedToday: 0, usedMonth: 0, remDaily: Infinity, remMonthly: Infinity, pctDaily: 0, pctMonthly: 0 };

  const today = todayStr();
  const curMonth = currentMonthKey();
  const isDefault = w.id === 'w_default' || w.id === ws[0].id;

  let delta = 0;
  let usedToday = 0;
  let usedMonth = 0;
  let withdrawnToday = 0, depositedToday = 0;
  let withdrawCount = 0, depositCount = 0;
  let withdrawnMonth = 0, depositedMonth = 0;
  let withdrawMonthCount = 0, depositMonthCount = 0;

  active().forEach(t => {
    if (t.type === 'تحويل قسم') {
      const fromW = (t.from && typeof t.from === 'string' && t.from.startsWith('w:')) ? t.from.slice(2) : (t.from === 'phone' ? (t.fromWalletId || (ws[0] && ws[0].id)) : t.fromWalletId);
      const toW = (t.to && typeof t.to === 'string' && t.to.startsWith('w:')) ? t.to.slice(2) : (t.to === 'phone' ? (t.walletId || (ws[0] && ws[0].id)) : t.walletId);
      if (fromW === w.id) {
        delta -= (Number(t.amount) || 0);
      }
      if (toW === w.id) {
        delta += (Number(t.amount) || 0);
      }
    } else {
      const match = t.walletId ? t.walletId === w.id : isDefault;
      if (match) {
        const p = Number(t.phoneDelta) || 0;
        delta += p;
        if (t.type === 'سحب' || t.type === 'ايداع') {
          const amt = Number(t.amount) || 0;
          if (t.date === today) {
            usedToday += amt;
            if (t.type === 'سحب') { withdrawnToday += amt; withdrawCount++; }
            if (t.type === 'ايداع') { depositedToday += amt; depositCount++; }
          }
          if (monthKeyOf(t.date) === curMonth) {
            usedMonth += amt;
            if (t.type === 'سحب') { withdrawnMonth += amt; withdrawMonthCount++; }
            if (t.type === 'ايداع') { depositedMonth += amt; depositMonthCount++; }
          }
        }
      }
    }
  });

  const balance = round2((Number(w.openingBalance) || 0) + delta);
  const dailyLimit = Number(w.dailyLimit) || 0;
  const monthlyLimit = Number(w.monthlyLimit) || 0;

  const remDaily = dailyLimit > 0 ? Math.max(0, round2(dailyLimit - usedToday)) : Infinity;
  const remMonthly = monthlyLimit > 0 ? Math.max(0, round2(monthlyLimit - usedMonth)) : Infinity;

  const pctDaily = dailyLimit > 0 ? Math.min(100, Math.round((usedToday / dailyLimit) * 100)) : 0;
  const pctMonthly = monthlyLimit > 0 ? Math.min(100, Math.round((usedMonth / monthlyLimit) * 100)) : 0;

  return {
    wallet: w,
    balance,
    usedToday: round2(usedToday),
    usedMonth: round2(usedMonth),
    withdrawnToday: round2(withdrawnToday),
    depositedToday: round2(depositedToday),
    withdrawCount,
    depositCount,
    withdrawnMonth: round2(withdrawnMonth),
    depositedMonth: round2(depositedMonth),
    withdrawMonthCount,
    depositMonthCount,
    remDaily,
    remMonthly,
    pctDaily,
    pctMonthly
  };
}

function syncTotalPhoneOpening() {
  const ws = getWallets();

}

  if (ws.length <= 1) return toast('لا يمكن حذف المحفظة الوحيدة');

  if (!w) return;
  if (state.txns.some(t => t.walletId === wid)) {
    return toast('هذا الرقم مسجل عليه عمليات سابقة، لا يمكن حذفه للحفاظ على دقة الحسابات');
  }
  if (!confirm('هل أنت متأكد من حذف محفظة "' + (w.label || w.phone) + '"؟')) return;

  toast('تم حذف رقم المحفظة');
  render();
}

async function addMainTxn() {
  if (!canWrite()) return;
  const d = state.draftMain;
  const amt = parseFloat(d.amount);
  if (!amt || amt <= 0) { state.err = 'اكتب مبلغ صحيح أكبر من صفر'; return render(); }
  if (!d.date) { state.err = 'اختار التاريخ'; return render(); }
  const td = mainTypeDef(d.type);
  if (!td) { state.err = 'نوع العملية غير صحيح'; return render(); }

  const T = totals();
  const wid = d.walletId || getActiveWalletId();
  const wallet = getWallets().find(w => w.id === wid) || getWallets()[0];

  // فحص حدود المحفظة اليومية والشهرية مع المنع التام والتنبيه
  if (td.phone !== 0 && wallet) {
    const wStat = getWalletStats(wallet.id);
    const dLim = Number(wallet.dailyLimit) || 0;
    const mLim = Number(wallet.monthlyLimit) || 0;

    if (dLim > 0 && (wStat.usedToday + amt) > dLim + 0.001) {
      state.err = '⚠️ تعذر تنفيذ العملية: المبلغ (' + fmt(amt) + ' ' + CUR + ') يتجاوز الحد اليومي لمحفظة ' + (wallet.label || wallet.phone) + ' (' + fmt(dLim) + ' ' + CUR + '). المتبقي اليوم: ' + fmt(wStat.remDaily) + ' ' + CUR + ' فقط - العملية لم تُنفّذ.';
      return render();
    }
    if (mLim > 0 && (wStat.usedMonth + amt) > mLim + 0.001) {
      state.err = '⚠️ تعذر تنفيذ العملية: المبلغ (' + fmt(amt) + ' ' + CUR + ') يتجاوز الحد الشهري لمحفظة ' + (wallet.label || wallet.phone) + ' (' + fmt(mLim) + ' ' + CUR + '). المتبقي هذا الشهر: ' + fmt(wStat.remMonthly) + ' ' + CUR + ' فقط - العملية لم تُنفّذ.';
      return render();
    }
    if (td.id === 'ايداع' && wStat.balance < amt) {
      state.err = '⚠️ رصيد محفظة ' + (wallet.label || wallet.phone) + ' (' + fmt(wStat.balance) + ' ' + CUR + ') أقل من مبلغ الإيداع (' + fmt(amt) + ' ' + CUR + ') - العملية اتلغت';
      return render();
    }
  }

  if (td.id === 'سحب' || td.id === 'فوري' || td.dir === 'w') {
    const cash = T.drawerBalance + T.commissionAccumulated;
    if (cash < amt) {
      state.err = 'الكاش المتاح في الدرج (' + fmt(cash) + ' ' + CUR + '، شامل العمولة) أقل من مبلغ العملية (' + fmt(amt) + ' ' + CUR + ') - العملية اتلغت';
      return render();
    }
  } else if (td.secId ? (T.acctB[td.secId] || 0) < amt : T.phoneBalance < amt) {
    state.err = 'رصيد ' + (td.secId ? secName(td.secId) : 'التلفون') + ' (' + fmt(td.secId ? (T.acctB[td.secId] || 0) : T.phoneBalance) + ' ' + CUR + ') أقل من مبلغ الإيداع (' + fmt(amt) + ' ' + CUR + ') - العملية اتلغت';
    return render();
  }

  const name = pickName(d.name), pid = uid();
  const recs = [{
    id: pid, date: d.date, time: curTimeStr(), at: Date.now(), type: td.base || d.type, name, notes: d.notes.trim(), amount: amt, flow: td.flow, sourceImportId: state.importingId || undefined,
    drawerDelta: round2(td.drawer * amt), phoneDelta: round2(td.phone * amt), payments: td.fawry ? [] : undefined, walletId: td.phone !== 0 ? wid : undefined,
    acct: td.secId ? { [td.secId]: round2(td.sec * amt) } : undefined, sec: td.secId,
    ref: (d.ref || '').trim() || undefined
  }];
  if (td.rate !== 0) {
    const cc = calcCommission(td, amt);
    if (cc.c !== 0) {
      recs.push({
        id: uid(), date: d.date, time: curTimeStr(), at: Date.now(), type: 'عمولة', name,
        notes: 'عمولة تلقائية (' + (Math.round(td.rate * 10000) / 100) + '%) على ' + td.label + (cc.usedMin ? ' - الحد الأدنى ' + fmt(cc.min) + ' ' + CUR : ''),
        amount: cc.c, flow: 'دائن', drawerDelta: 0, phoneDelta: 0, auto: true, parentId: pid
      });
    }
  }
  const prev = state.txns.slice();
  state.txns = state.txns.concat(recs);
  if (!(await persist('txns'))) { state.txns = prev; state.err = 'تعذر حفظ البيانات، حاول مرة أخرى.'; return render(); }

  audit('add', typeLabel(recs[0].type) + ' ' + fmt(amt) + ' — ' + name + ' — ' + recs[0].id);
  state.draftMain = { date: d.date, type: 'سحب', secDir: 'w', name: S().people[0], amount: '', notes: '', walletId: '', ref: '' };
  state.err = ''; state.panel = null;
  render(); autoExport();
}

async function addAdjustTxn() {
  if (!canWrite()) return;
  if (!(await requireAuth('تسجيل تعديل رصيد', 'void'))) return;
  const d = state.draftAdjust;
  const amt = parseFloat(d.amount);
  if (!amt || amt <= 0) return toast('اكتب مبلغ صحيح أكبر من صفر');
  if (!d.date) return toast('اختار التاريخ');
  const fd = adjustFlowDef(d.flow);

  const target = d.target || 'drawer';
  const isDrawer = target === 'drawer';
  const isPhone = target === 'phone' || (typeof target === 'string' && target.startsWith('w:'));
  const wid = (typeof target === 'string' && target.startsWith('w:')) ? target.slice(2) : (target === 'phone' ? getActiveWalletId() : undefined);

  if (fd.id === 'سحب') {
    const T = totals();
    const avail = isDrawer ? (T.drawerBalance + T.commissionAccumulated) : (wid ? getWalletStats(wid).balance : T.phoneBalance);
    if (avail < amt) return toast('الرصيد المتاح في ' + adjustTargetLabel(target) + ' (' + fmt(avail) + ') أقل من المبلغ');
  }
  const delta = round2(fd.sign * amt);
  const rec = {
    id: uid(), date: d.date, time: curTimeStr(), at: Date.now(), type: 'تعديل رصيد', name: fd.label + ' (' + adjustTargetLabel(target) + ')',
    notes: d.notes.trim(), amount: amt, flow: fd.id, target,
    drawerDelta: isDrawer ? delta : 0, phoneDelta: isPhone ? delta : 0,
    walletId: wid
  };
  const prev = state.txns.slice();
  state.txns = state.txns.concat([rec]);
  if (!(await persist('txns'))) { state.txns = prev; return toast('تعذر حفظ البيانات'); }
  audit('adjust', fd.label + ' ' + fmt(amt) + ' (' + adjustTargetLabel(target) + ')');
  state.draftAdjust = { date: d.date, flow: 'اضافة', target: 'drawer', amount: '', notes: '' };
  state.panel = null;
  toast('تم تسجيل التعديل'); render(); autoExport();
}

async function addPayment(id) {
  if (!canWrite()) return;
  const t = find(id);
  if (!t || isVoided(t) || !hasPay(t)) return;
  const amt = parseFloat(state.payInput);

function monthRows(mk) {

  const data = rows.map(t => {
    const isL = t.type === 'دائن' || t.type === 'مدين';
    const e = isL ? ledgerEffects(t) : plainFx(t);
    const v = !!isVoided(t);
    return {
      'التاريخ': fmtDate(t.date),
      'النوع': typeLabel(t.type) + (t.auto ? ' (تلقائي)' : '') + (v ? ' (ملغاة)' : ''),
      'الاسم': t.name,

    };
  });

    } else { const fx = plainFx(t); dw += fx.drawer; ph += fx.phone; }
  });

  data.push({ 'التاريخ': 'إجمالي المدين المتبقي', 'المبلغ': db });

}

  if (!h) { state.folder.status = 'none'; return; }
  dirHandle = h;
  try {
    const perm = await h.queryPermission({ mode: 'readwrite' });
    state.folder.name = h.name; state.folder.status = perm === 'granted' ? 'granted' : 'prompt';
  } catch (e) { state.folder.status = 'none'; }
}
async function chooseFolder() {
  if (!supportsFS) return toast('متصفحك لا يدعم الحفظ التلقائي. استخدم Chrome أو Edge');
  try {
    const h = await window.showDirectoryPicker();
    if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') return toast('لازم توافق على إذن الكتابة');
    dirHandle = h; state.folder = { status: 'granted', name: h.name };
    await idbSet(IDB_KEY, h); render();
    await autoExport(); toast('تم الاتصال بالمجلد وكتابة الملفات ✅');
  } catch (e) { if (e && e.name !== 'AbortError') { console.warn(e); toast('حصل خطأ أثناء اختيار المجلد'); } }
}
async function reconnectFolder() {
  if (!dirHandle) return;
  try {
    if ((await dirHandle.requestPermission({ mode: 'readwrite' })) === 'granted') {
      state.folder.status = 'granted'; render(); await autoExport(); toast('تم إعادة الاتصال ✅');
    } else toast('لسه محتاج إذن');
  } catch (e) { console.warn(e); }
}

// --- 1. إدارة تعدد المستأجرين والفروع (Multi-Tenancy) ---
function getTenants() {
  try {
    const raw = localStorage.getItem('wl:tenants');
    if (raw) {
      const list = JSON.parse(raw);
      if (Array.isArray(list) && list.length) return list;
    }
  } catch (e) {}
  return [{ id: 'main', name: S().shopName || 'الفرع الرئيسي', code: 'HQ-01', currency: CUR }];
}
function saveTenants(list) {
  try { localStorage.setItem('wl:tenants', JSON.stringify(list)); } catch (e) {}
  try { if (typeof cloudPushTenants === 'function') cloudPushTenants(list); } catch (e) {}
}
function currentTenant() {
  const list = getTenants();
  return list.find(t => t.id === PROFILE) || { id: PROFILE, name: S().shopName || 'الفرع الرئيسي', code: PROFILE, currency: CUR };
}
function switchTenant(tenantId) {
  if (tenantId === PROFILE) return;
  localStorage.setItem('wl:cur', tenantId);
  location.reload();
}
async function createTenant(name, code) {
  const list = getTenants();
  const id = 't_' + Date.now().toString(36);
  list.push({ id, name: name.trim() || 'فرع جديد', code: (code || id).toUpperCase(), currency: CUR, createdAt: Date.now() });
  saveTenants(list);
  toast('تم إنشاء الفرع الجديد بنجاح');
  switchTenant(id);
}

// --- 2. إدارة الأدوار والصلاحيات (RBAC) ---
const ROLES = {
  admin: { id: 'admin', label: 'المدير / المالك', desc: 'صلاحيات كاملة على كل شيء' },
  cashier: { id: 'cashier', label: 'كاشير / مسؤول نوبة', desc: 'تسجيل العمليات والإيصالات، حجب رأس المال والإلغاء' },
  accountant: { id: 'accountant', label: 'محاسب / مراجع', desc: 'مراجعة التقارير وسجل التدقيق والديون فقط' }
};
function roleLabel(r) { return (ROLES[r] && ROLES[r].label) || r || 'مستخدم'; }

function getUsers() {
  const users = (S() && S().users) || [];
  if (Array.isArray(users) && users.length) return users;
  const p0 = (S() && S().people && S().people[0]) || 'المدير';
  return [
    { id: 'u_admin', name: p0, role: 'admin', pin: '', active: true },
    { id: 'u_cashier', name: 'الكاشير', role: 'cashier', pin: '', active: true }
  ];
}
function getCurrentUser() {
  if (state.currentUser) return state.currentUser;
  const users = getUsers();
  const active = users.find(u => u.active !== false) || users[0];
  state.currentUser = active;
  return active;
}
async function switchUser(userId) {
  const users = getUsers();
  const target = users.find(u => u.id === userId);
  if (!target) return;
  const cur = getCurrentUser();
  if (target.id === cur.id) return;

  // عند التبديل إلى حساب المدير: طلب كلمة السر فوراً
  if (target.role === 'admin') {
    const ok = await askPw('اكتب كلمة سر المدير لتسجيل الدخول كـ ' + target.name, 'admin');
    if (!ok) return;
  } else if (target.role === 'cashier' && cur.role === 'admin') {
    // التبديل من المدير للكاشير: إذا كانت كلمة سر الكاشير محددة يطلبها
    if (state.settings.customPasswordsEnabled && state.settings.passwords && state.settings.passwords.cashier && state.settings.passwords.cashier.hash) {
      const ok = await askPw('اكتب كلمة سر الكاشير للدخول كـ ' + target.name, 'cashier');
      if (!ok) return;
    }
  }

  state.currentUser = target;

  // إذا أصبح المستخدم كاشير: إخفاء إدارة الخطوط والإعدادات فوراً والرجوع للرئيسية وإلغاء أي جلسة مفتوحة
  if (target.role === 'cashier') {
    state.authUntil = 0;
    state.authCategories = {};
    if (state.tab === 'set') {
      state.tab = 'home';
    }
  }

  audit('user-switch', 'تبديل المستخدم إلى: ' + target.name + ' (' + roleLabel(target.role) + ')');
  toast('تم تبديل المستخدم إلى: ' + target.name);
  render();
}
function canViewCapital() {
  const u = getCurrentUser();
  if (u.role === 'admin' || u.role === 'accountant') return true;
  return S().showCapitalToCashier !== false;
}
function canManageSettings() {
  if (state.authUntil === Infinity) return true;
  return getCurrentUser().role === 'admin';
}
function canVoidDirectly() {
  if (state.authUntil === Infinity) return true;
  return getCurrentUser().role === 'admin';
}

// --- 4. جرد الوردية وتسليم الكاشير (Shift Handover) ---
function getShiftSummary(cashierName) {
  const name = cashierName || getCurrentUser().name;
  const today = todayStr();
  const txs = active().filter(t => t.date === today && (t.name === name || (t.notes && t.notes.includes(name))));
  const w = txs.filter(t => t.type === 'سحب'), dp = txs.filter(t => t.type === 'ايداع'), ld = txs.filter(t => t.type === 'دائن' || t.type === 'مدين');
  const sum = a => a.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const com = active().filter(t => t.date === today && t.type === 'عمولة' && t.name === name).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  return {
    cashier: name,
    date: today,
    count: txs.length,
    withdrawCount: w.length,
    withdrawSum: sum(w),
    depositCount: dp.length,
    depositSum: sum(dp),
    commissionSum: com,
    ledgerCount: ld.length
  };
}

function normalizeTransferDigits(text) {
  return String(text || '').replace(/[٠-٩۰-۹]/g, function(c) { return String('٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹'.indexOf(c) % 10); }).replace(/[٬٫]/g, function(c) { return c === '٬' ? ',' : '.'; });
}
function parseTransferNotice(text) {
  const normalized = normalizeTransferDigits(text);
  const match = normalized.match(/(?:مبلغ|قدر|amount|egp|جنيه|ج\.م)\s*(?:هو|:|：)?\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)/i) || normalized.match(/([0-9][0-9,]*(?:\.[0-9]{1,2})?)\s*(?:جنيه|ج\.م|egp|le)\b/i);
  const amount = match ? Number(match[1].replace(/,/g, '')) : 0;
  const lower = normalized.toLowerCase();
  let type = '';
  if (/(تم استلام|استلمت|وصلك|وارد|استقبلت|إضافة رصيد|اضافة رصيد|received|credited|deposit received)/i.test(lower)) type = 'سحب';
  else if (/(تم إرسال|تم ارسال|خصم|صادر|أرسلت|ارسلت|تم سحب|sent|debited|withdrawn)/i.test(lower)) type = 'ايداع';
  return { amount: Number.isFinite(amount) && amount > 0 ? round2(amount) : 0, type: type };
}
function pendingImportsKey() {
  let owner = 'local';
  try { owner = (cloudUser && cloudUser.uid) || localStorage.getItem('wl:uid') || owner; } catch (e) {}
  return 'wallet:pending-imports:' + PROFILE + ':' + owner;
}
function readPendingImports() {
  try { const x = JSON.parse(localStorage.getItem(pendingImportsKey()) || '[]'); return Array.isArray(x) ? x.filter(p => p && p.id && p.createdAt) : []; } catch (e) { return []; }
}
function savePendingImports() {
  try { localStorage.setItem(pendingImportsKey(), JSON.stringify(state.pendingImports || [])); return true; } catch (e) { toast('تعذر حفظ قائمة المراجعة على هذا الجهاز'); return false; }
}
function queueTransferNotice(text, source) {
  const parsed = parseTransferNotice(text);
  state.reviewText = '';
  state.reviewEditId = '';
  state.reviewDraft = { amount: parsed.amount ? String(parsed.amount) : '', type: parsed.type, walletId: getActiveWalletId() || '' };
  const fingerprint = String(cyrb53(normalizeTransferDigits(text)));
  if ((state.pendingImports || []).some(p => p.fingerprint === fingerprint) || state.txns.some(t => t.sourceImportId === fingerprint)) { toast('الرسالة دي اتضافت قبل كده'); return false; }
  state.pendingImports.push({ id: uid(), fingerprint: fingerprint, amount: parsed.amount, type: parsed.type, walletId: getActiveWalletId() || '', createdAt: Date.now(), source: source || 'paste' });
  savePendingImports(); state.tab = 'review'; state.panel = null; render(); toast(parsed.amount ? 'اتضافت للمراجعة — راجع البيانات قبل التسجيل' : 'اتضافت للمراجعة — اكتب المبلغ والنوع يدويًا'); return true;
}
function consumeIncomingTransfer() {
  const encoded = window.__mohafzatyIncomingTransfer || '';
  window.__mohafzatyIncomingTransfer = '';
  if (!encoded) return;
  try { const raw = atob(encoded.replace(/-/g, '+').replace(/_/g, '/')); const bytes = Uint8Array.from(raw, c => c.charCodeAt(0)); const text = new TextDecoder().decode(bytes); queueTransferNotice(text, 'android-notification'); } catch (e) {}
}
async function confirmImport(id) {
  const item = (state.pendingImports || []).find(p => p.id === id); if (!item) return;
  if (!item.type || !item.amount || item.amount <= 0) { editImport(item.id); toast('راجع المبلغ والنوع أولاً'); return; }
  state.importingId = item.fingerprint;
  state.draftMain = { date: todayStr(), type: item.type, secDir: 'w', name: '', amount: String(item.amount), notes: 'تمت مراجعتها من رسالة تحويل', walletId: item.walletId || getActiveWalletId() || '', ref: '' };
  state.tab = 'home'; state.panel = 'main'; await addMainTxn();
  const saved = state.txns.some(t => t.sourceImportId === item.fingerprint); state.importingId = '';
  if (saved) { state.pendingImports = state.pendingImports.filter(p => p.id !== id); savePendingImports(); audit('import_confirmed', 'تأكيد عملية واردة من رسالة | ' + fmt(item.amount) + ' | ' + item.fingerprint); render(); toast('تم تسجيل العملية بعد مراجعتك'); }
}

function chartSvg(mk, list) {
  const [y, m] = mk.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const vals = new Array(days).fill(0);
  list.filter(t => t.type === 'عمولة' && monthKeyOf(t.date) === mk).forEach(t => { const d = Number((t.date || '').slice(8, 10)); if (d >= 1 && d <= days) vals[d - 1] += Number(t.amount) || 0; });
  const max = Math.max.apply(null, vals.concat([1]));
  const W = 700, H = 150, bw = W / days;
  const bars = vals.map((v, i) => {
    const h = Math.round(v / max * (H - 24));
    return '<rect x="' + (i * bw + 2) + '" y="' + (H - 16 - h) + '" width="' + (bw - 4) + '" height="' + h + '" fill="#8C6E2F"><title>' + (i + 1) + ': ' + fmt(v) + '</title></rect>' +
      ((i + 1) % 5 === 0 || i === 0 ? '<text x="' + (i * bw + bw / 2) + '" y="' + (H - 3) + '" font-size="10" text-anchor="middle" fill="#596153">' + (i + 1) + '</text>' : '');
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="العمولة اليومية">' + bars + '</svg>';
}

function viewStats() {

  const maxVol = Math.max(...vols, 1);

  const chart = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:var(--paper-raised);border-radius:12px;padding:10px;margin-top:10px" role="img" aria-label="حجم التداول لآخر 7 أيام">' + bars + '</svg>';

  if (!r) return;
  if (!r.p1 || r.p1.length < 4) return toast('كلمة السر قصيرة (4 حروف/أرقام على الأقل)');
  if (r.p1 !== r.p2) return toast('كلمتا السر غير متطابقتين');
  await setCategoryPassword(catKey, r.p1);
  audit('password-cat', 'تعديل كلمة سر: ' + catLabelName);
  toast('تم حفظ كلمة سر (' + catLabelName + ') بنجاح ✓');
  render();
}
async function resetCatPw(catKey) {

}

function updatePreviews() {
  const mp = $('mainPreview');
  if (mp) {
    const td = mainTypeDef(state.draftMain.type), amt = parseFloat(state.draftMain.amount) || 0;
    if (td && td.rate !== 0 && amt > 0) {
      const c = calcCommission(td, amt);
      mp.style.display = 'block';
      mp.innerHTML = (c.c < 0 ? 'هتتقيد عمولة بالسالب: ' : 'هتتضاف عمولة تلقائية منفصلة: ') + '<span class="num">' + fmt(c.c) + '</span> ' + CUR + ' (' + (Math.round(td.rate * 10000) / 100) + '%' + (c.usedMin ? ' - حد أدنى ' + fmt(c.min) : '') + ')';
    } else { mp.style.display = 'none'; mp.innerHTML = ''; }
  }
  const lp = $('ledgerPreview');
  if (lp) {
    const amt = parseFloat(state.draftLedger.amount) || 0, c = round2(parseFloat(state.draftLedger.commission) || 0);
    if (amt <= 0 && c <= 0) { lp.style.display = 'none'; lp.innerHTML = ''; }
    else {
      lp.style.display = 'block';
      lp.innerHTML = (amt > 0 ? esc(sourceLabel(ledgerSource(state.draftLedger))) + ' هيتأثر بمبلغ <span class="num">' + fmt(amt) + '</span> ' + CUR : '') +
        (c > 0 ? (amt > 0 ? ' · ' : '') + 'هتتقيد عمولة <span class="num">' + fmt(c) + '</span> ' + CUR + ' في خانة العمولة' : '');
    }
  }
  const cp = $('closePreview');
  if (cp) {
    const T = totals(), expC = round2(T.drawerBalance + T.commissionAccumulated), expP = round2(T.phoneBalance);
    const aC = parseFloat(state.draftClose.drawer), aP = parseFloat(state.draftClose.phone);
    if (isNaN(aC) && isNaN(aP)) { cp.style.display = 'none'; cp.innerHTML = ''; }
    else {
      const dc = isNaN(aC) ? null : round2(aC - expC), dp = isNaN(aP) ? null : round2(aP - expP);
      const lbl = v => v === null ? '—' : (Math.abs(v) < 0.01 ? 'مظبوط ✅' : (v > 0 ? 'زيادة ' : 'عجز ') + '<span class="num">' + fmt(Math.abs(v)) + '</span>');
      cp.style.display = 'block';
      cp.innerHTML = 'الكاش: ' + lbl(dc) + ' · التلفون: ' + lbl(dp);
    }
  }
}

function setPath(p, v) {
  const parts = p.split('.'); let o = state;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = v;
}
function restoreFocus(id) {
  const el = id && $(id);
  if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; }
}

function onInput(e) {
  const el = e.target, b = el.dataset && el.dataset.bind;
  if (!b) return;
  setPath(b, el.type === 'checkbox' ? el.checked : el.value);
  if (el.dataset.live !== undefined && e.type === 'input') { state.filters.limit = 50; render(); restoreFocus(el.id); return; }
  if (el.dataset.render !== undefined && e.type === 'change') { if (b.startsWith('filters.')) state.filters.limit = 50; render(); return; }
  updatePreviews();
}

async function goTab(t) {
  const isCashier = getCurrentUser().role === 'cashier';
  if (isCashier && t === 'set') {
    toast('شاشة الإعدادات مقفولة ومخصصة للمدير فقط');
    return;
  }
  if (t === 'set' && !(await requireAuth('الدخول للإعدادات', 'settings'))) return;
  state.tab = t; state.panel = null; state.err = ''; state.mobileMenuOpen = false;
  if (t !== 'review' && new URLSearchParams(location.search).get('section') === 'review') { const next = new URL(location.href); next.searchParams.delete('section'); history.replaceState(null, '', next.pathname + next.search + next.hash); }
  if (t === 'set') initSetDrafts();
  render(); if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') window.scrollTo(0, 0);
}

async function tryUnlock() {
  const inp = $('lockPw'); if (!inp) return;
  if (Date.now() < state.lockoutUntil) { $('lockErr').textContent = 'استنى شوية وحاول تاني'; return; }
  if (await verifyPw(inp.value)) { state.locked = false; state.authUntil = Date.now() + 5 * 60 * 1000; render(); }
  else {
    state.failCount++;
    if (state.failCount >= 5) { state.lockoutUntil = Date.now() + 30000; state.failCount = 0; }
    $('lockErr').textContent = 'كلمة السر غلط'; inp.value = ''; inp.focus();
  }
}

(function wire() {
  const app = $('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('input', onInput);
  app.addEventListener('change', e => {
    if (e.target && e.target.id === 'restoreFile') {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => restoreFromText(String(r.result));
      r.readAsText(f); e.target.value = '';
      return;
    }
    onInput(e);
  });
  app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lockPw') tryUnlock(); });
  if (typeof window !== 'undefined' && window.addEventListener) {
    let navFlowSpace = 0;
    const syncCompactNavigation = function () {
      const scrolled = (window.scrollY || document.documentElement.scrollTop || 0) > 56;
      const nav = document.querySelector('#app .tabs');
      const spacer = document.querySelector('#app .tabs-spacer');
      const alreadyScrolled = document.body.classList.contains('nav-scrolled');
      if (scrolled && nav && !alreadyScrolled) {
        const navStyle = window.getComputedStyle(nav);
        navFlowSpace = nav.offsetHeight +
          (parseFloat(navStyle.marginTop) || 0) +
          (parseFloat(navStyle.marginBottom) || 0);
      }
      if (alreadyScrolled !== scrolled) {
        document.body.classList.toggle('nav-scrolled', scrolled);
      }
      if (scrolled && nav && spacer) spacer.style.height = Math.ceil(navFlowSpace) + 'px';
      const moreButton = document.querySelector('#app .tab-mobile-more');
      if (moreButton) {
        const moreActive = ['wallets', 'set', 'support', 'review'].includes(state.tab) ||
          (scrolled && ['cust', 'rep', 'stats'].includes(state.tab));
        moreButton.classList.toggle('on', moreActive || !!state.mobileMenuOpen);
      }
      if (!scrolled && spacer) {
        spacer.style.height = '0px';
        navFlowSpace = 0;
      }
    };
    window.addEventListener('scroll', syncCompactNavigation, { passive: true });
    syncCompactNavigation();
  }
})();

function fbInit() {

function ledgerCol() { return fbDb.collection('users').doc(cloudUser.uid).collection('ledger'); }
function splitChunks(str, size) {
  const out = []; let i = 0;
  while (i < str.length) {
    let end = Math.min(i + size, str.length);
    if (end < str.length) { const c = str.charCodeAt(end - 1); if (c >= 0xD800 && c <= 0xDBFF) end -= 1; }
    out.push(str.slice(i, end)); i = end;
  }
  if (!out.length) out.push('');
  return out;
}
var cloudCache = { t: 0, str: '' };
function isFirestoreNetworkError(e) {
  const m = String(e && (e.message || e.code) || e || '').toLowerCase();
  return m.indexOf('offline') >= 0 || m.indexOf('unavailable') >= 0 || m.indexOf('network') >= 0;
}
async function firestoreGet(ref) {
  if (!fbDb) throw new Error('خدمة المزامنة غير مهيأة');
  /* Firestore manages its network state automatically. Repeatedly calling
     forcing the network online while already connected can break the SDK async queue. */
  try { return await ref.get(); }
  catch (e) {
    if (!isFirestoreNetworkError(e)) throw e;
    await new Promise(function (resolve) { setTimeout(resolve, 1500); });
    return await ref.get();
  }
}
async function firestoreCommit(batch) {
  if (!fbDb) throw new Error('خدمة المزامنة غير مهيأة');
  return await batch.commit();
}
async function cloudFetch() {
  const col = ledgerCol();
  const m = await firestoreGet(col.doc(PROFILE + '_meta'));
  if (!m.exists) return null;
  const md = m.data(), n = md.n | 0;
  if (!n) return null;
  /* لو ماحصلش تغيير من آخر قراءة نستخدم النسخة المحفوظة (قراءة واحدة بس بدل قراءة كل الأجزاء) */
  if (cloudCache.t === md.t && cloudCache.str) return JSON.parse(cloudCache.str);
  const snaps = await Promise.all(Array.from({ length: n }, function (_, i) { return firestoreGet(col.doc(PROFILE + '_c' + i)); }));
  const parts = [];
  for (const s of snaps) {
    if (!s.exists || s.data().t !== md.t) throw new Error('البيانات بتتحدّث من جهاز تاني — هتتعاد المحاولة تلقائيًا');
    parts.push(s.data().s);
  }
  const full = parts.join('');
  cloudCache = { t: md.t, str: full };
  return JSON.parse(full);
}
async function cloudPush(obj) {
  const col = ledgerCol(), str = JSON.stringify(obj), t = Date.now();
  const chunks = splitChunks(str, CLOUD_CHUNK);
  const old = await firestoreGet(col.doc(PROFILE + '_meta'));
  const oldN = old.exists ? (old.data().n | 0) : 0;
  const b = fbDb.batch();
  chunks.forEach(function (s, i) { b.set(col.doc(PROFILE + '_c' + i), { s: s, t: t, i: i }); });
  for (let i = chunks.length; i < oldN; i++) b.delete(col.doc(PROFILE + '_c' + i));
  b.set(col.doc(PROFILE + '_meta'), { n: chunks.length, t: t, v: APP_VERSION, size: str.length });
  await firestoreCommit(b);
  cloudCache = { t: t, str: str };
}

async function addTransfer() {

  const d = state.draftSec, to = trTo(), amt = parseFloat(d.amount);

  const T = totals();
  const avail = d.from === 'ext' ? Infinity :
    d.from === 'drawer' ? T.drawerBalance + T.commissionAccumulated :
    (typeof d.from === 'string' && d.from.startsWith('w:')) ? getWalletStats(d.from.slice(2)).balance :
    d.from === 'phone' ? T.phoneBalance :
    (T.acctB[d.from] || 0);
  if (avail < amt) return toast('الرصيد في "' + secName(d.from) + '" (' + fmt(avail) + ') أقل من المبلغ');

  const fromWid = (typeof d.from === 'string' && d.from.startsWith('w:')) ? d.from.slice(2) : (d.from === 'phone' ? getActiveWalletId() : undefined);
  const toWid = (typeof to === 'string' && to.startsWith('w:')) ? to.slice(2) : (to === 'phone' ? getActiveWalletId() : undefined);

  const t = {
    id: uid(),
    date: todayStr(),
    time: curTimeStr(),
    at: Date.now(),
    type: 'تحويل قسم',
    name: secName(d.from) + ' ← ' + secName(to),
    notes: (d.notes || '').trim(),
    amount: amt,
    flow: 'تحويل',
    from: d.from,
    to: to,
    drawerDelta: 0,
    phoneDelta: 0,
    acct: {},
    walletId: toWid,
    fromWalletId: fromWid
  };

  [[d.from, -amt], [to, amt]].forEach(x => {
    const k = x[0], v = x[1];
    if (k === 'drawer') t.drawerDelta = round2(t.drawerDelta + v);
    else if (k === 'phone' || (typeof k === 'string' && k.startsWith('w:'))) t.phoneDelta = round2(t.phoneDelta + v);
    else if (k !== 'ext') t.acct[k] = round2((t.acct[k] || 0) + v);
  });
  const prev = state.txns.slice(); state.txns = prev.concat([t]);
  if (!(await persist('txns'))) { state.txns = prev; return toast('تعذر حفظ البيانات'); }
  audit('transfer', t.name + ' — ' + fmt(amt));
  state.draftSec = { from: 'drawer', to: '', amount: '', notes: '' }; state.panel = null;
  render(); autoExport();
}
