name: Preview Mohafzaty Pro on Cloudflare Pages

on:
  push:
    branches:
      - wallet-guides-shop
      - add-ga4-website-analytics
      - track-registration-download-clicks
    paths:
      - 'site/**'
      - '.github/workflows/preview-pages.yml'

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Get preview branch files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler@latest pages deploy site --project-name=mohafzaty-pro --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
