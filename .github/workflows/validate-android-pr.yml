name: Validate Android app changes

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'site/.well-known/assetlinks.json'
      - '.github/workflows/validate-android-pr.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare the launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-nodpi
          base64 --decode android/assets/mohafzatypro-icon-192.png.base64 > android/app/src/main/res/mipmap-nodpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-nodpi/ic_launcher.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android debug package
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
